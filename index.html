<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lern Mehr</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#4f6df5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lern Mehr">
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --text:#1d2433; --muted:#6b7385; --line:#e3e6ee;
  --accent:#4f6df5; --accent-text:#fff; --ok:#1f9d63; --warn:#d9822b; --danger:#d64545; --free:#e9ebf2;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12151d; --card:#1b1f2b; --text:#e8ebf3; --muted:#9097a8; --line:#2b3040;
    --accent:#7088ff; --accent-text:#0b0e17; --ok:#3ac183; --warn:#e8a050; --danger:#ef6b6b; --free:#252a39; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
main{max-width:860px;margin:0 auto;padding:20px 16px}
h1{font-size:1.5rem;margin:0 0 4px} h2{font-size:1.1rem;margin:0 0 12px}
.muted{color:var(--muted)} .small{font-size:.85rem}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px;z-index:10}
nav button{flex:1;max-width:200px;border:0;background:none;color:var(--muted);padding:10px 8px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.active{background:var(--accent);color:var(--accent-text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:130px;resize:vertical}
button.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer}
button.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.btn.danger{color:var(--danger)}
.bar{height:10px;background:var(--free);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--ok);transition:width .3s}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{flex:1;min-width:110px;background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.3rem}
.task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;border-left:6px solid var(--c,var(--accent))}
.task input{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.task .t{flex:1;min-width:0}
.task .t div:first-child{font-weight:600}
.task.done .t div:first-child{text-decoration:line-through;color:var(--muted)}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--free);color:var(--muted);white-space:nowrap}
.tag.over{background:var(--warn);color:#fff}
.notice{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 18%,var(--card));border:1px solid var(--warn);margin-bottom:16px}
.notice.ok{background:color-mix(in srgb,var(--ok) 15%,var(--card));border-color:var(--ok)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600;padding:4px 0}
.day{min-height:78px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;overflow:hidden;font-size:.7rem;text-align:left;color:var(--text);font-family:inherit}
.day.out{opacity:.35;cursor:default}
.day.free{background:var(--free);}
.day.today{outline:2px solid var(--accent)}
.day.sel{outline:2px solid var(--text)}
.day.exam{background:color-mix(in srgb,var(--danger) 20%,var(--bg));border-color:var(--danger)}
.day .n{font-weight:700;font-size:.8rem;display:block;margin-bottom:2px}
.chip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:1px 4px;margin-bottom:2px;background:color-mix(in srgb,var(--c) 28%,transparent);border-left:3px solid var(--c)}
.chip.d{opacity:.5;text-decoration:line-through}
@media(max-width:560px){.day{min-height:56px;padding:2px}.chip{font-size:0;height:6px;padding:0}.day .m{display:none}}
.topic{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.topic input[type=number]{width:84px;flex:none}
.empty{text-align:center;padding:30px 10px}
.task .mv{flex:none;padding:6px 10px;font-size:.8rem;white-space:nowrap}
.task button.tag{border:0;cursor:pointer;font:inherit;font-size:.75rem}
@media(max-width:480px){.task{flex-wrap:wrap}.task .t{flex-basis:calc(100% - 40px)}.task .mv{margin-left:34px}}
.folder{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:0 12px 10px;background:var(--bg)}
.folder summary{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;padding:12px 0;cursor:pointer;list-style:none;font-weight:600}
.folder summary::-webkit-details-marker{display:none}
.folder[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}
</style>
</head>
<body>
<main id="app"></main>
<nav>
  <button data-p="today">Heute</button>
  <button data-p="cal">Kalender</button>
  <button data-p="set">Einstellungen</button>
</nav>

<script>
/* ---------- Zustand ---------- */
const KEY = 'lernmehr-v1';
const fresh = () => ({ subjects:[], topics:[], freeDays:[], done:{}, moves:{}, dayLimit:0 });
let S = load();
let page = 'today';
let calMonth = new Date(); calMonth.setDate(1);
let selDay = null;

function newSubject(name, o={}){
  return { id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name, examDate:'', repeats:3, minutes:60, ramp:'rising', ...o };
}
function getSubject(name){
  let s = S.subjects.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!s){ s = newSubject(name); S.subjects.push(s); }
  return s;
}
/* Alte Daten (ein Prüfungsdatum für alles, Fach als Vorsatz im Themennamen) in Fächer umwandeln */
function migrate(s){
  s.subjects ||= []; s.topics ||= []; s.freeDays ||= []; s.done ||= {}; s.moves ||= {}; s.dayLimit = +s.dayLimit || 0;
  const legacy = s.topics.some(t=>!t.subjectId);
  if(legacy){
    for(const t of s.topics){
      if(t.subjectId) continue;
      const m = t.name.match(/^(.{1,40}?):\s+(.+)$/), subjName = m ? m[1].trim() : 'Allgemein';
      if(m) t.name = m[2];
      let sub = s.subjects.find(x=>x.name.toLowerCase()===subjName.toLowerCase());
      if(!sub){ sub = newSubject(subjName,{examDate:s.examDate||'', repeats:s.repeats ?? 2, minutes:s.minutes||60, ramp:'flat'}); s.subjects.push(sub); }
      t.subjectId = sub.id;
    }
    if(s.subjects.length>1 && !s.dayLimit) s.dayLimit = s.minutes||0;   // bisherige Tageszeit wird zum Gesamtlimit
  }
  return s;
}
function load(){
  try{ return migrate(Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY)||'{}'))); }
  catch(e){ return fresh(); }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Datum-Helfer ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d,12); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const todayIso = () => iso(new Date());
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const fmt = (s,o) => parse(s).toLocaleDateString('de-DE',o);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue = id => { let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 65% 55%)`; };
const fmtMin = m => m>=60 ? `${Math.floor(m/60)} h${m%60?` ${m%60} min`:''}` : `${m} min`;

/* ---------- Planung ---------- */
const RAMP = { flat:0, rising:1, strong:3 };
const RAMP_LABEL = { flat:'Gleichmäßig', rising:'Steigend', strong:'Stark steigend' };
const subOf = id => S.subjects.find(s=>s.id===id);
const subBudget = sub => Math.max(15, +sub.minutes||60);
function roundLabel(r){ return r===0 ? 'Lernen' : `Wiederholung ${r}`; }

function subjectSessions(sub){
  const budget = subBudget(sub), list = [];
  const topics = S.topics.filter(t=>t.subjectId===sub.id);
  for(let r=0;r<=sub.repeats;r++){
    for(const t of topics){
      const total = r===0 ? t.min : Math.max(10, Math.round(t.min*0.5/5)*5);
      const parts = Math.ceil(total/budget);
      for(let p=0;p<parts;p++){
        const m = p<parts-1 ? budget : total-budget*(parts-1);
        list.push({ key:`${t.id}:${r}:${p}`, subjectId:sub.id, topicId:t.id, name:t.name, round:r, part:p, parts, min:m });
      }
    }
  }
  return list;
}
const allSessions = () => S.subjects.flatMap(subjectSessions);

function computePlan(){
  const today = todayIso(), limit = +S.dayLimit || 0;
  const sessions = allSessions(), byKey = Object.fromEntries(sessions.map(s=>[s.key,s]));
  const days = {}, add = (d,t)=>{ (days[d] ||= []).push(t); };

  // erledigte Aufgaben liegen an ihrem Erledigt-Datum
  const doneToday = {}; let doneTodayAll = 0;
  for(const [k,d] of Object.entries(S.done)){
    const s = byKey[k]; if(!s) continue;
    add(d,{...s,done:true});
    if(d===today){ doneToday[s.subjectId] = (doneToday[s.subjectId]||0)+s.min; doneTodayAll += s.min; }
  }

  const info = { pendingMin:0, overflow:0, unscheduled:0, subjects:{}, noDate:[] };
  const plans = [];
  for(const sub of S.subjects){
    const pending = sessions.filter(s=>s.subjectId===sub.id && !S.done[s.key]);
    const pm = pending.reduce((a,s)=>a+s.min,0);
    const si = info.subjects[sub.id] = { pending:pm, overflow:0, availDays:0, daysLeft:null, status:'ok' };
    if(!sub.examDate){ si.status='nodate'; if(pm){ info.noDate.push(sub.name); info.pendingMin += pm; } continue; }
    si.daysLeft = diffDays(today, sub.examDate);
    if(si.daysLeft<=0){ si.status='past'; continue; }
    info.pendingMin += pm;
    const avail = [];
    for(let d=today; diffDays(d,sub.examDate)>0; d=addDays(d,1)) if(!S.freeDays.includes(d)) avail.push(d);
    si.availDays = avail.length;
    plans.push({ sub, pending, avail, k:RAMP[sub.ramp] ?? 0 });
  }
  const dayList = [...new Set(plans.flatMap(p=>p.avail))].sort();

  // Tag für Tag verteilen; fullSet = Fächer, die voll auslasten müssen (sonst reicht die Zeit nicht)
  const run = fullSet => {
    const out = {}, q = {}, rest = {};
    const pins = {}, away = {};                           // vom Nutzer verschobene Aufgaben: fester Tag / entlasteter Tag
    for(const p of plans){
      const id = p.sub.id; q[id] = []; pins[id] = {}; away[id] = {};
      for(const s of p.pending){
        const mv = S.moves[s.key];
        if(mv && p.avail.includes(mv.to)){
          (pins[id][mv.to] ||= []).push(s);
          for(const f of mv.from) away[id][f] = (away[id][f]||0) + s.min;   // am alten Tag nicht wieder auffüllen
        } else q[id].push(s);
      }
      rest[id] = p.pending.reduce((a,s)=>a+s.min,0);
    }
    for(const d of dayList){
      let globalLeft = limit>0 ? limit-(d===today?doneTodayAll:0) : Infinity;
      const active = plans.filter(p=>p.avail.includes(d)).sort((a,b)=>a.sub.examDate.localeCompare(b.sub.examDate));
      for(const p of active){
        const id = p.sub.id, n = p.avail.length, i = p.avail.indexOf(d);
        const cap = Math.max(0, Math.min(subBudget(p.sub)-(d===today?(doneToday[id]||0):0), globalLeft));
        let target = cap;
        if(!fullSet.has(id)){
          const w = j => 1 + p.k*(n>1 ? j/(n-1) : 0);       // Gewicht steigt Richtung Prüfung
          let sumW = 0; for(let j=i;j<n;j++) sumW += w(j);
          target = Math.min(cap, Math.ceil(rest[id]*w(i)/sumW));
        }
        let used = 0;
        for(const s of (pins[id][d]||[])){ (out[d] ||= []).push({...s,done:false,moved:true}); used += s.min; rest[id] -= s.min; }
        const lighter = away[id][d] || 0;
        if(lighter){ target -= lighter; if(target<=0){ globalLeft -= used; continue; } }
        while(q[id].length){
          const s = q[id][0];
          const fits = (used===0 && !lighter) ? s.min<=cap : used+s.min <= Math.min(cap, target+10);
          if(!fits) break;
          (out[d] ||= []).push({...s,done:false}); used += s.min; rest[id] -= s.min; q[id].shift();
        }
        globalLeft -= used;
      }
    }
    return {out,q};
  };
  const fullSet = new Set();
  let res = run(fullSet);
  for(let it=0; it<=plans.length; it++){
    const need = plans.filter(p=>res.q[p.sub.id].length && !fullSet.has(p.sub.id));
    if(!need.length) break;
    need.forEach(p=>fullSet.add(p.sub.id)); res = run(fullSet);
  }
  for(const [d,ts] of Object.entries(res.out)) ts.forEach(t=>add(d,t));
  for(const p of plans){
    const left = res.q[p.sub.id]; if(!left.length) continue;
    const miss = left.reduce((a,s)=>a+s.min,0), si = info.subjects[p.sub.id];
    si.overflow = miss; info.overflow += miss;
    const last = p.avail[p.avail.length-1];
    if(last) left.forEach(s=>add(last,{...s,done:false,over:true}));
    else { info.unscheduled += left.length; si.status='noroom'; }
  }
  return {days,info};
}

/* ---------- Rendering ---------- */
const app = document.getElementById('app');

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));
  const plan = computePlan();
  app.innerHTML = page==='today' ? viewToday(plan) : page==='cal' ? viewCal(plan) : viewSettings();
  window.scrollTo(0,0 + (page==='cal'?window.scrollY:0));
}

const ready = () => S.topics.length && S.subjects.some(s=>s.examDate);
const examsOn = d => S.subjects.filter(s=>s.examDate===d).map(s=>s.name);
const lastExam = () => S.subjects.map(s=>s.examDate).filter(Boolean).sort().pop() || '';

function setupHint(){
  return `<div class="card empty"><h2>Noch kein Lernplan</h2>
    <p class="muted">Lege in den Einstellungen deine Fächer mit Prüfungsdatum, Lernzeit und Themen an.</p>
    <button class="btn primary" onclick="go('set')">Zu den Einstellungen</button></div>`;
}

function taskHtml(t,editable=true,day=''){
  const sub = subOf(t.subjectId);
  const canMove = !t.done && day && day>=todayIso();
  const mv = canMove ? `<button class="btn mv" onclick="moveTask('${t.key}','${day}')" title="Auf den nächsten Lerntag verschieben">${day===todayIso()?'Morgen':'Nächster Tag'} ›</button>` : '';
  const pinned = t.moved ? `<button class="tag" onclick="unmoveTask('${t.key}')" title="Verschiebung aufheben">verschoben ✕</button>` : '';
  const line = `${sub?esc(sub.name)+' · ':''}${roundLabel(t.round)}${t.parts>1?` · Teil ${t.part+1}/${t.parts}`:''} · ${fmtMin(t.min)}`;
  return `<label class="task ${t.done?'done':''}" style="--c:${hue(t.subjectId)}">
    ${editable?`<input type="checkbox" ${t.done?'checked':''} onchange="toggleDone('${t.key}')">`:''}
    <div class="t"><div>${esc(t.name)}</div><div class="small muted">${line}</div></div>
    ${t.over?'<span class="tag over">Zu wenig Zeit</span>':''}${pinned}${mv}
  </label>`;
}

function subProgress(sub){
  const all = subjectSessions(sub), tot = all.reduce((a,s)=>a+s.min,0);
  return tot ? Math.round(all.filter(s=>S.done[s.key]).reduce((a,s)=>a+s.min,0)/tot*100) : 0;
}

function viewToday(plan){
  if(!ready()) return `<h1>Heute</h1>${setupHint()}`;
  const today = todayIso(), {info} = plan;
  const upcoming = S.subjects.filter(s=>s.examDate && diffDays(today,s.examDate)>0).sort((a,b)=>a.examDate.localeCompare(b.examDate));
  const next = upcoming[0];
  const all = allSessions(), totalMin = all.reduce((a,s)=>a+s.min,0);
  const doneMin = all.filter(s=>S.done[s.key]).reduce((a,s)=>a+s.min,0);
  const pct = totalMin ? Math.round(doneMin/totalMin*100) : 0;
  const tasks = plan.days[today] || [];
  const isFree = S.freeDays.includes(today);
  const todayMin = tasks.reduce((a,t)=>a+t.min,0), todayDone = tasks.filter(t=>t.done).reduce((a,t)=>a+t.min,0);
  const exToday = examsOn(today);

  let body;
  if(isFree) body = `<div class="card empty"><h2>Heute ist lernfrei 🎉</h2><p class="muted">Der Plan wurde auf die übrigen Tage verteilt.</p>
    <button class="btn" onclick="toggleFree('${today}')">Lernfrei aufheben</button></div>`;
  else if(!tasks.length) body = `<div class="card empty"><h2>Für heute ist nichts geplant ✅</h2><p class="muted">${info.pendingMin?'Die nächsten Aufgaben findest du im Kalender.':'Du hast alles geschafft!'}</p></div>`;
  else body = `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0">Heute zu erledigen</h2><span class="muted small">${fmtMin(todayDone)} / ${fmtMin(todayMin)}</span></div>
      ${tasks.map(t=>taskHtml(t,true,today)).join('')}
      <button class="btn" style="margin-top:6px" onclick="toggleFree('${today}')">Heute lernfrei machen</button></div>`;

  const exams = S.subjects.filter(s=>s.examDate).sort((a,b)=>a.examDate.localeCompare(b.examDate));
  return `<h1>Heute</h1><p class="muted">${fmt(today,{weekday:'long',day:'numeric',month:'long'})}</p>
    ${exToday.length?`<div class="notice ok">Heute Prüfung: <b>${exToday.map(esc).join(', ')}</b> – viel Erfolg! 🍀</div>`:''}
    ${warnHtml(info)}
    <div class="card"><div class="stats">
      <div class="stat"><b>${next?diffDays(today,next.examDate):'–'}</b><span class="small muted">${next?`Tage bis ${esc(next.name)}`:'keine Prüfung offen'}</span></div>
      <div class="stat"><b>${pct}%</b><span class="small muted">geschafft</span></div>
      <div class="stat"><b>${fmtMin(info.pendingMin)}</b><span class="small muted">noch offen</span></div></div>
      <div class="bar"><div style="width:${pct}%"></div></div></div>
    ${body}
    <div class="card"><h2>Deine Prüfungen</h2>${exams.map(s=>{
      const dl = diffDays(today,s.examDate), p = subProgress(s);
      return `<div style="margin-bottom:12px"><div class="row" style="justify-content:space-between"><b>${esc(s.name)}</b>
        <span class="small muted">${fmt(s.examDate,{weekday:'short',day:'numeric',month:'short'})} · ${dl>0?`noch ${dl} ${dl===1?'Tag':'Tage'}`:dl===0?'heute':'vorbei'}</span></div>
        <div class="bar" style="margin-top:6px"><div style="width:${p}%;background:${hue(s.id)}"></div></div></div>`;
    }).join('')}</div>`;
}

function warnHtml(info){
  let h = '';
  const bad = S.subjects.filter(s=>info.subjects[s.id] && (info.subjects[s.id].overflow || info.subjects[s.id].status==='noroom'));
  if(bad.length){
    h += `<div class="notice"><b>Der Plan ist zu voll.</b><br>${bad.map(s=>{
      const i = info.subjects[s.id];
      return i.status==='noroom' ? `${esc(s.name)}: kein freier Lerntag mehr vor der Prüfung.` : `${esc(s.name)}: es fehlen ca. ${fmtMin(i.overflow)}.`;
    }).join('<br>')}<br><span class="small">Erhöhe die Lernzeit (pro Fach oder insgesamt), reduziere Wiederholungen oder streiche Lernfrei-Tage.</span></div>`;
  }
  if(info.noDate.length) h += `<div class="notice">Für <b>${info.noDate.map(esc).join(', ')}</b> fehlt noch das Prüfungsdatum – ${info.noDate.length>1?'diese Fächer sind':'dieses Fach ist'} noch nicht im Plan.</div>`;
  return h;
}

function viewCal(plan){
  if(!ready()) return `<h1>Kalender</h1>${setupHint()}`;
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), today = todayIso();
  const first = new Date(y,m,1,12), offset = (first.getDay()+6)%7, nDays = new Date(y,m+1,0).getDate();
  let cells = ['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<offset;i++) cells += '<div></div>';
  for(let d=1; d<=nDays; d++){
    const s = `${y}-${pad(m+1)}-${pad(d)}`;
    const tasks = plan.days[s] || [], free = S.freeDays.includes(s), ex = examsOn(s);
    const mins = tasks.reduce((a,t)=>a+t.min,0);
    const show = ex.length ? 2 : 3;
    const chips = tasks.slice(0,show).map(t=>`<span class="chip ${t.done?'d':''}" style="--c:${hue(t.subjectId)}">${esc(t.name)}</span>`).join('') + (tasks.length>show?`<span class="muted">+${tasks.length-show}</span>`:'');
    cells += `<button class="day ${free?'free':''} ${s===today?'today':''} ${s===selDay?'sel':''} ${ex.length?'exam':''}" onclick="selectDay('${s}')">
      <span class="n">${d}</span>${ex.length?`<span class="chip" style="--c:var(--danger)">${ex.map(esc).join(', ')}</span>`:''}${free?'<span class="muted">frei</span>':chips}
      ${mins&&!free?`<span class="muted m">${fmtMin(mins)}</span>`:''}</button>`;
  }
  const title = calMonth.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  return `<h1>Kalender</h1>${warnHtml(plan.info)}
    <div class="card"><div class="cal-head"><button class="btn" onclick="moveMonth(-1)">‹</button><b>${title}</b><button class="btn" onclick="moveMonth(1)">›</button></div>
    <div class="cal">${cells}</div></div>${dayDetail(plan)}`;
}

function dayDetail(plan){
  if(!selDay) return '<p class="muted small" style="text-align:center">Tippe auf einen Tag für Details oder um ihn lernfrei zu markieren.</p>';
  const today = todayIso(), tasks = plan.days[selDay] || [], free = S.freeDays.includes(selDay);
  const ex = examsOn(selDay), canToggle = selDay>=today && selDay<lastExam();
  return `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">${fmt(selDay,{weekday:'long',day:'numeric',month:'long'})}</h2>
    ${canToggle?`<button class="btn ${free?'':'danger'}" onclick="toggleFree('${selDay}')">${free?'Lernfrei aufheben':'Lernfrei machen'}</button>`:''}</div>
    ${ex.length?`<p>Prüfung: <b>${ex.map(esc).join(', ')}</b> 🍀</p>`:''}
    ${free?'<p class="muted">Lernfreier Tag – keine Aufgaben.</p>':tasks.length?tasks.map(t=>taskHtml(t,selDay<=today,selDay)).join(''):(ex.length?'':'<p class="muted">Keine Aufgaben an diesem Tag.</p>')}</div>`;
}

function viewSettings(){
  const today = todayIso();
  const folders = S.subjects.map(sub=>{
    const ts = S.topics.filter(t=>t.subjectId===sub.id);
    const dl = sub.examDate ? diffDays(today,sub.examDate) : null;
    const exam = sub.examDate ? `Prüfung ${fmt(sub.examDate,{day:'numeric',month:'short'})}${dl>0?` · noch ${dl} T.`:dl===0?' · heute':' · vorbei'}` : 'kein Prüfungsdatum';
    return `<details class="folder" data-s="${sub.id}" ${openSubj.has(sub.id)?'open':''} ontoggle="toggleSubj(this)">
      <summary><span class="fname">📁 ${esc(sub.name)}</span><span class="small muted">${exam} · ${ts.length} ${ts.length===1?'Thema':'Themen'} · ${fmtMin(ts.reduce((a,t)=>a+t.min,0))}</span></summary>
      <div class="grid" style="margin-bottom:14px">
        <label class="f">Name<input value="${esc(sub.name)}" onchange="setSub('${sub.id}','name',this.value)"></label>
        <label class="f">Prüfungsdatum<input type="date" value="${sub.examDate}" onchange="setSub('${sub.id}','examDate',this.value)"></label>
        <label class="f">Lernzeit pro Tag (Min.)<input type="number" min="15" step="15" value="${sub.minutes}" onchange="setSub('${sub.id}','minutes',this.value)"></label>
        <label class="f">Wiederholungen
          <select onchange="setSub('${sub.id}','repeats',+this.value)">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${sub.repeats===n?'selected':''}>${n===0?'keine':n+'×'}</option>`).join('')}</select></label>
        <label class="f">Lernverlauf
          <select onchange="setSub('${sub.id}','ramp',this.value)">${Object.entries(RAMP_LABEL).map(([k,v])=>`<option value="${k}" ${sub.ramp===k?'selected':''}>${v}</option>`).join('')}</select>
          <span class="small muted">„Steigend“: je näher die Prüfung, desto mehr pro Tag</span></label>
      </div>
      ${ts.map(t=>`<div class="topic"><input value="${esc(t.name)}" onchange="editTopic('${t.id}','name',this.value)">
        <input type="number" min="10" step="5" value="${t.min}" title="Minuten" onchange="editTopic('${t.id}','min',+this.value)"><span class="small muted">min</span>
        <button class="btn danger" onclick="delTopic('${t.id}')" aria-label="Löschen">✕</button></div>`).join('') || '<p class="muted small">Noch keine Themen in diesem Fach.</p>'}
      <button class="btn danger" style="margin-top:8px" onclick="delSubject('${sub.id}')">Fach mit allen Themen löschen</button>
    </details>`;
  }).join('');
  const subjList = `<datalist id="subjList">${S.subjects.map(s=>`<option value="${esc(s.name)}">`).join('')}</datalist>`;

  return `<h1>Einstellungen</h1><p class="muted">Der Plan passt sich bei jeder Änderung automatisch an.</p>
  ${subjList}
  <div class="card"><h2>Gesamte Lernzeit</h2>
    <label class="f">Maximal pro Tag über alle Fächer (Minuten)
      <input type="number" min="0" step="15" value="${S.dayLimit}" onchange="setLimit(this.value)">
      <span class="small muted">0 = kein Limit. Sonst teilen sich alle Fächer diese Zeit, das Fach mit der nächsten Prüfung hat Vorrang.</span></label></div>

  <div class="card"><h2>Fächer &amp; Prüfungen (${S.subjects.length})</h2>
    <p class="small muted">Jedes Fach hat sein eigenes Prüfungsdatum, seine eigene Lernzeit pro Tag und seinen eigenen Lernverlauf.</p>
    ${folders || '<p class="muted">Noch keine Fächer.</p>'}
    <div class="row" style="margin-top:10px"><input id="newSubj" placeholder="Neues Fach, z. B. Marketing" style="flex:1;min-width:160px"><button class="btn primary" onclick="addSubject()">Fach hinzufügen</button></div></div>

  <div class="card"><h2>Themen einfügen</h2>
    <p class="small muted">Füge deinen Lernzettel ein – ein Thema pro Zeile. Optional mit Dauer: <code>Zellatmung; 60</code>. Aufzählungszeichen, Nummern und Markdown-Überschriften (#) werden entfernt. Standard: 45 min.</p>
    <label class="f" style="margin-bottom:10px">Fach<input id="pasteSubj" list="subjList" placeholder="Fach wählen oder neu eintippen"></label>
    <textarea id="paste" placeholder="Zellatmung; 60&#10;Photosynthese&#10;Genetik; 90"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn primary" onclick="importTopics()">Hinzufügen</button></div></div>

  <div class="card"><h2>Themen aus Dateien</h2>
    <p class="small muted">Lade deine Lernzettel hoch – PDFs, Fotos oder Screenshots (auch mehrere auf einmal). Text wird direkt gelesen, Bilder und gescannte PDFs per Texterkennung (beim ersten Mal ein paar MB Download). Alles passiert auf deinem Gerät, nichts wird hochgeladen.</p>
    <button class="btn primary" onclick="document.getElementById('files').click()">Dateien auswählen</button>
    <input type="file" id="files" multiple accept="application/pdf,image/*,.txt,.md" hidden onchange="handleFiles(this.files)">
    <div id="xstatus" class="small muted" style="margin-top:10px">${busy?'Wird gelesen …':''}</div>
    ${groups.map((g,gi)=>`<div style="margin-top:16px"><b>${esc(g.file)}</b>
      <div class="row" style="margin:8px 0"><label class="f" style="flex:1;min-width:180px">Fach
        <input value="${esc(g.prefix)}" list="subjList" placeholder="z. B. Marketing" onchange="groups[${gi}].prefix=this.value.trim()"></label>
        <button class="btn" onclick="gAll(${gi},true)">Alle</button><button class="btn" onclick="gAll(${gi},false)">Keine</button></div>
      ${g.lines.length?g.lines.map((l,li)=>`<div class="topic" style="${l.on?'':'opacity:.55'}"><input type="checkbox" style="width:22px;flex:none" ${l.on?'checked':''} onchange="groups[${gi}].lines[${li}].on=this.checked;render()">
        <input value="${esc(l.t)}" onchange="groups[${gi}].lines[${li}].t=this.value"></div>`).join(''):'<p class="muted small">Kein Text erkannt.</p>'}</div>`).join('')}
    ${groups.length?`<div class="row" style="margin-top:12px"><button class="btn primary" onclick="addGroups()">Ausgewählte Themen hinzufügen</button><button class="btn" onclick="groups=[];render()">Verwerfen</button></div>
      <p class="small muted">Prüfe die Liste: Überschriften und Störtext sind vorab abgewählt, du kannst alles anpassen.</p>`:''}
  </div>

  <div class="card"><h2>Lernfreie Tage (${S.freeDays.length})</h2>
    <p class="small muted">Im Kalender antippen, um Tage lernfrei zu markieren.</p>
    ${S.freeDays.length?S.freeDays.sort().map(d=>`<span class="tag" style="margin:2px">${fmt(d,{weekday:'short',day:'numeric',month:'short'})} <a href="#" onclick="toggleFree('${d}');return false">✕</a></span>`).join(''):''}
  </div>

  <div class="card"><h2>Sichern &amp; übertragen</h2>
    <p class="small muted">Exportiere deinen Plan als Datei, um ihn zu sichern oder auf ein anderes Gerät oder einen anderen Browser zu übertragen.</p>
    <div class="row"><button class="btn primary" onclick="exportData()">Exportieren</button>
    <button class="btn" onclick="document.getElementById('imp').click()">Importieren</button>
    <input type="file" id="imp" accept=".json,application/json" hidden onchange="importData(this.files[0])"></div>
    <div style="margin-top:14px"><button class="btn danger" onclick="resetAll()">Alles zurücksetzen</button></div></div>`;
}

/* ---------- Aktionen ---------- */
let openSubj = new Set();
function go(p){ page=p; render(); }
function toggleDone(key){ if(S.done[key]) delete S.done[key]; else { S.done[key]=todayIso(); delete S.moves[key]; } save(); render(); }
/* Aufgabe auf den nächsten Lerntag verschieben – der restliche Plan verteilt sich neu */
function moveTask(key,from){
  const s = allSessions().find(x=>x.key===key), sub = s && subOf(s.subjectId); if(!sub) return;
  let d = addDays(from,1); while(S.freeDays.includes(d)) d = addDays(d,1);
  if(!sub.examDate || diffDays(d,sub.examDate)<=0){ alert(`Weiter verschieben geht nicht – die Prüfung ${sub.name} ist am ${fmt(sub.examDate,{day:'numeric',month:'long'})}.`); return; }
  const prev = S.moves[key];
  S.moves[key] = { to:d, from:[...(prev?prev.from:[]), from] }; save(); render();
}
function unmoveTask(key){ delete S.moves[key]; save(); render(); }
function toggleFree(d){ const i=S.freeDays.indexOf(d); if(i>=0) S.freeDays.splice(i,1); else S.freeDays.push(d); save(); render(); }
function selectDay(d){ selDay=d; render(); }
function moveMonth(n){ calMonth=new Date(calMonth.getFullYear(),calMonth.getMonth()+n,1); render(); }
function toggleSubj(el){ el.open ? openSubj.add(el.dataset.s) : openSubj.delete(el.dataset.s); }
function setLimit(v){ S.dayLimit = Math.max(0, +v||0); save(); render(); }
function setSub(id,k,v){
  const s = subOf(id); if(!s) return;
  if(k==='minutes') v = Math.max(15, +v||60);
  if(k==='name'){ v = v.trim(); if(!v) return render(); }
  s[k] = v; save(); render();
}
function addSubject(){
  const el = document.getElementById('newSubj'), n = el.value.trim(); if(!n) return;
  const sub = getSubject(n); openSubj.add(sub.id); save(); render();
}
function delSubject(id){
  const s = subOf(id); if(!s) return;
  const n = S.topics.filter(t=>t.subjectId===id).length;
  if(!confirm(`Fach „${s.name}“ mit ${n} Themen löschen?`)) return;
  S.topics = S.topics.filter(t=>t.subjectId!==id); S.subjects = S.subjects.filter(x=>x.id!==id); save(); render();
}
function editTopic(id,f,v){ const t=S.topics.find(t=>t.id===id); if(!t) return; if(f==='min') v=Math.max(10,v||45); else v=v.trim()||t.name; t[f]=v; save(); render(); }
function delTopic(id){ S.topics=S.topics.filter(t=>t.id!==id); save(); render(); }
function resetAll(){ if(confirm('Alle Daten und den gesamten Plan zurücksetzen?')){ S=fresh(); save(); render(); } }
/* ---------- Themen aus Dateien (PDF / Bild / Text) ---------- */
let groups = [], busy = false;
const LIBS = {
  pdf: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',
  pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  tess: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'
};
const scriptCache = {};
function loadScript(url){
  return scriptCache[url] ||= new Promise((res,rej)=>{
    const s = document.createElement('script'); s.src = url; s.onload = res;
    s.onerror = ()=>{ delete scriptCache[url]; rej(new Error('Bibliothek konnte nicht geladen werden (Internet?)')); };
    document.head.appendChild(s);
  });
}
function setStatus(t){ const el = document.getElementById('xstatus'); if(el) el.textContent = t; }

let ocrWorker = null;
async function ocr(src){
  await loadScript(LIBS.tess);
  if(!ocrWorker){ setStatus('Texterkennung wird vorbereitet (einmaliger Download) …'); ocrWorker = await Tesseract.createWorker('deu'); }
  const r = await ocrWorker.recognize(src);
  return r.data.text;
}

async function pdfText(file){
  await loadScript(LIBS.pdf);
  if(!pdfjsLib.GlobalWorkerOptions.workerSrc.startsWith('blob:')){
    const code = await (await fetch(LIBS.pdfWorker)).text();
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
  }
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let out = '';
  for(let p=1;p<=pdf.numPages;p++){
    setStatus(`${file.name}: Seite ${p} von ${pdf.numPages} …`);
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = {};
    for(const it of tc.items){ if(!it.str.trim()) continue; const k = Math.round(it.transform[5]/4); (rows[k] ||= []).push(it); }
    let txt = Object.keys(rows).map(Number).sort((a,b)=>b-a)
      .map(k=>rows[k].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ')).join('\n');
    if((txt.match(/\p{L}/gu)||[]).length < 15){            // kein Textlayer → Seite als Bild lesen
      const vp = page.getViewport({scale:2.5}), cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      setStatus(`${file.name}: Seite ${p} wird per Texterkennung gelesen …`);
      txt = await ocr(cv);
    }
    out += txt + '\n';
  }
  return out;
}

const STOP = /^(lernplan|thema|meine lernnotizen|offene fragen|notizen|seite\s*\d|inhalt|inhaltsverzeichnis)\b|viermal lernen|abhaken|goodnotes|\d{1,2}:\d{2}/i;
function cleanLine(l){
  const t = l.replace(/[□■☐☑☒✓✔▪●○]/g,' ').replace(/^\s*(#+|[-*•·]|\d+[.)])\s*/,'').replace(/[*_`|]/g,' ').replace(/\s+/g,' ').trim();
  // Reste von Kästchen/Tabellenspalten am Zeilenende (z. B. "[ [1 =") abschneiden
  const tok = t.split(' ');
  while(tok.length>1 && /^(?:[^\p{L}\d]+.*|[^\p{L}]*\p{Ll}[^\p{L}]*|[^\p{L}]+\p{Lu}[^\p{L}]*|.*[\[\]=]+.*)$/u.test(tok[tok.length-1]) && !(/\p{L}/u.test(tok[tok.length-1]) && /[?!.:)]$/.test(tok[tok.length-1])) ) tok.pop();
  return tok.join(' ');
}
function candidates(text){
  const seen = new Set(), res = [];
  for(const raw of text.split(/\r?\n/)){
    const t = cleanLine(raw);
    if(!t || seen.has(t.toLowerCase())) continue;
    seen.add(t.toLowerCase());
    const letters = (t.match(/\p{L}/gu)||[]).length;
    const on = t.length>=5 && t.length<=90 && letters/t.length>=0.7 && !STOP.test(t) && !/^[\d\s.,-]+$/.test(t);
    res.push({t,on});
  }
  return res;
}
function prefixFromName(n){
  return n.replace(/\.[^.]+$/,'').replace(/^lernplan[\s_-]*/i,'').replace(/[_-]+/g,' ').replace(/\s*\(\d+\)$/,'').trim();
}

async function handleFiles(list){
  const files = [...list]; if(!files.length) return;
  busy = true; setStatus('Wird gelesen …');
  for(const f of files){
    try{
      let text;
      if(f.type==='application/pdf' || /\.pdf$/i.test(f.name)) text = await pdfText(f);
      else if(f.type.startsWith('image/')){ setStatus(`${f.name}: Texterkennung läuft …`); text = await ocr(f); }
      else text = await f.text();
      groups.push({file:f.name, prefix:prefixFromName(f.name), lines:candidates(text)});
    }catch(e){
      groups.push({file:f.name, prefix:'', lines:[]});
      alert(`„${f.name}“ konnte nicht gelesen werden: ${e.message||e}`);
    }
  }
  busy = false; render();
}
function gAll(gi,on){ groups[gi].lines.forEach(l=>l.on=on); render(); }
function addTopics(sub, items){   // items: [{name,min}]
  const have = new Set(S.topics.filter(t=>t.subjectId===sub.id).map(t=>t.name.toLowerCase())); let n=0;
  for(const it of items){
    const name = it.name.trim();
    if(!name || have.has(name.toLowerCase())) continue;
    have.add(name.toLowerCase());
    S.topics.push({id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+n++, subjectId:sub.id, name, min:it.min||45});
  }
  openSubj.add(sub.id);
}
function addGroups(){
  for(const g of groups){
    const items = g.lines.filter(l=>l.on).map(l=>({name:l.t}));
    if(items.length) addTopics(getSubject(g.prefix || 'Allgemein'), items);
  }
  groups = []; save(); render();
}

function exportData(){
  const blob = new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `lernplan-${todayIso()}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(file){
  if(!file) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || !Array.isArray(d.topics)) throw 0;
      if(!confirm('Aktuellen Plan durch die importierte Datei ersetzen?')) return;
      S = migrate(Object.assign(fresh(), d));
      save(); render();
    }catch(e){ alert('Die Datei ist kein gültiger Lernplan.'); }
  };
  r.readAsText(file);
}
function importTopics(){
  const txt = document.getElementById('paste').value;
  const subj = document.getElementById('pasteSubj').value.trim() || 'Allgemein';
  const items = [];
  for(let line of txt.split(/\r?\n/)){
    line = line.replace(/^\s*(#+|[-*•]|\d+[.)])\s*/,'').replace(/[*_`]/g,'').trim();
    if(!line) continue;
    let min = 45; const m = line.match(/^(.*?)\s*[;|]\s*(\d+)\s*(?:min)?\s*$/i);
    if(m){ line=m[1].trim(); min=Math.max(10,+m[2]); }
    items.push({name:line,min});
  }
  if(!items.length) return;
  addTopics(getSubject(subj), items);
  save(); render();
}


/* Wischen im Kalender: links = nächster Monat, rechts = voriger Monat */
let swipe = null;
app.addEventListener('touchstart',e=>{ swipe = (page==='cal' && e.touches.length===1) ? {x:e.touches[0].clientX,y:e.touches[0].clientY} : null; },{passive:true});
app.addEventListener('touchend',e=>{
  if(!swipe || page!=='cal') return;
  const t = e.changedTouches[0], dx = t.clientX-swipe.x, dy = t.clientY-swipe.y; swipe = null;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) moveMonth(dx<0 ? 1 : -1);
},{passive:true});

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
render();
</script>
