<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lern Mehr</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="theme-color" content="#4f6df5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lern Mehr">
<style>
:root{
  --bg:#f5f6fa; --card:#fff; --text:#1d2433; --muted:#6b7385; --line:#e3e6ee;
  --accent:#4f6df5; --accent-text:#fff; --ok:#1f9d63; --warn:#d9822b; --danger:#d64545; --free:#e9ebf2;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#12151d; --card:#1b1f2b; --text:#e8ebf3; --muted:#9097a8; --line:#2b3040;
    --accent:#7088ff; --accent-text:#0b0e17; --ok:#3ac183; --warn:#e8a050; --danger:#ef6b6b; --free:#252a39; }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px}
main{max-width:860px;margin:0 auto;padding:20px 16px}
h1{font-size:1.5rem;margin:0 0 4px} h2{font-size:1.1rem;margin:0 0 12px}
.muted{color:var(--muted)} .small{font-size:.85rem}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;gap:4px;padding:8px;z-index:10}
nav button{flex:1;max-width:200px;border:0;background:none;color:var(--muted);padding:10px 8px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
nav button.active{background:var(--accent);color:var(--accent-text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:16px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:.9rem}
input,textarea,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
textarea{min-height:130px;resize:vertical}
button.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer}
button.btn.primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
button.btn.danger{color:var(--danger)}
.bar{height:10px;background:var(--free);border-radius:99px;overflow:hidden}
.bar>div{height:100%;background:var(--ok);transition:width .3s}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}
.stat{flex:1;min-width:110px;background:var(--bg);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.3rem}
.task{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;border-left:6px solid var(--c,var(--accent))}
.task .tl{display:flex;align-items:center;gap:12px;flex:1;min-width:0;cursor:pointer}
.task input[type=checkbox]{width:22px;height:22px;flex:none;accent-color:var(--ok)}
.task .t{flex:1;min-width:0}
.task .t div:first-child{font-weight:600}
.task.done .t div:first-child{text-decoration:line-through;color:var(--muted)}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--free);color:var(--muted);white-space:nowrap}
.tag.over{background:var(--warn);color:#fff}
.notice{padding:12px 14px;border-radius:12px;background:color-mix(in srgb,var(--warn) 18%,var(--card));border:1px solid var(--warn);margin-bottom:16px}
.notice.ok{background:color-mix(in srgb,var(--ok) 15%,var(--card));border-color:var(--ok)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600;padding:4px 0}
.day{min-height:78px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;overflow:hidden;font-size:.7rem;text-align:left;color:var(--text);font-family:inherit}
.day.out{opacity:.35;cursor:default}
.day.free{background:var(--free);}
.day.today{outline:2px solid var(--accent)}
.day.sel{outline:2px solid var(--text)}
.day.exam{background:color-mix(in srgb,var(--danger) 20%,var(--bg));border-color:var(--danger)}
.day .n{font-weight:700;font-size:.8rem;display:block;margin-bottom:2px}
.chip{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:1px 4px;margin-bottom:2px;background:color-mix(in srgb,var(--c) 28%,transparent);border-left:3px solid var(--c)}
.chip.d{opacity:.5;text-decoration:line-through}
@media(max-width:560px){.day{min-height:56px;padding:2px}.chip{font-size:0;height:6px;padding:0}.day .m{display:none}}
.topic{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.topic input[type=number]{width:84px;flex:none}
.empty{text-align:center;padding:30px 10px}
.task.cheer{animation:taskflash .9s ease-out}
.task.cheer input[type=checkbox]{animation:cbpop .55s cubic-bezier(.3,1.8,.5,1)}
@keyframes taskflash{0%{background:color-mix(in srgb,var(--ok) 38%,var(--card))}100%{background:transparent}}
@keyframes cbpop{0%{transform:scale(.4)}60%{transform:scale(1.6)}100%{transform:scale(1)}}
.confetti{position:fixed;left:0;top:0;z-index:90;width:8px;height:12px;border-radius:2px;pointer-events:none;
  transform:translate(var(--x),var(--y));animation:confetti var(--t,1s) cubic-bezier(.2,.6,.3,1) forwards}
@keyframes confetti{
  0%{transform:translate(var(--x),var(--y)) rotate(0deg);opacity:1}
  35%{transform:translate(calc(var(--x) + var(--dx)*.8),calc(var(--y) + var(--up))) rotate(calc(var(--rot)*.4));opacity:1}
  100%{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) + var(--down))) rotate(var(--rot));opacity:0}}
.gifpop{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:95;background:var(--card);padding:6px;border-radius:16px;
  box-shadow:0 8px 30px rgba(0,0,0,.3);animation:gifin .35s cubic-bezier(.3,1.5,.5,1);cursor:pointer;transition:opacity .45s,transform .45s}
.gifpop.out{opacity:0;transform:translateX(-50%) translateY(14px)}
.gifpop img{display:block;max-width:min(78vw,340px);max-height:40vh;border-radius:12px}
.ggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-height:50vh;overflow:auto}
.gcell{border:0;padding:0;border-radius:10px;overflow:hidden;background:var(--bg);cursor:pointer;aspect-ratio:1;display:block}
.gcell img{width:100%;height:100%;object-fit:cover;display:block}
.gifprev{max-width:100%;max-height:140px;border-radius:12px;display:block}
@keyframes gifin{0%{opacity:0;transform:translateX(-50%) scale(.6)}100%{opacity:1;transform:translateX(-50%) scale(1)}}
@media (prefers-reduced-motion:reduce){.task.cheer,.task.cheer input[type=checkbox]{animation:none}.confetti{display:none}.gifpop{display:none}}
.task .mv{flex:none;padding:6px 10px;font-size:.8rem;white-space:nowrap}
.task button.tag{border:0;cursor:pointer;font:inherit;font-size:.75rem}
.mvs{display:flex;gap:6px;flex:none}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);color:var(--text);border-radius:16px;padding:16px;width:100%;max-width:380px;max-height:92vh;overflow:auto}
.pcal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:8px 0}
.pcal .dow{text-align:center;font-size:.7rem;color:var(--muted);font-weight:600}
.exrow{margin-bottom:12px;cursor:pointer;padding:8px;margin-left:-8px;margin-right:-8px;border-radius:10px}
.exrow:active,.exrow:hover{background:var(--bg)}
.ov{width:100%;border-collapse:collapse;font-size:.85rem}
.ov th{background:var(--free);text-align:left;padding:8px 6px;font-size:.75rem;border-bottom:2px solid var(--line)}
.ov th:not(:first-child){text-align:center;width:54px}
.ov td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.ov td.c{text-align:center;line-height:1.2}
.ck{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border:2px solid var(--muted);border-radius:5px;font-size:.8rem;font-weight:700}
.ck.on{background:var(--ok);border-color:var(--ok);color:#fff}
.ck.half{border-color:var(--ok);color:var(--ok)}
.colors summary{cursor:pointer;font-weight:600;font-size:.9rem;list-style:none;display:flex;align-items:center;padding:4px 0}
.colors summary::-webkit-details-marker{display:none}
.colors .sw{padding:8px 0 4px}
.topics{border-top:1px solid var(--line);padding-top:4px}
.topics summary{cursor:pointer;font-weight:600;padding:10px 0;list-style:none}
.topics summary::-webkit-details-marker{display:none}
.topics[open] summary{margin-bottom:4px}
.wlist{max-height:46vh;overflow:auto;padding-right:2px}
.tlist{margin:0 0 4px;padding-left:22px;color:var(--muted);font-size:.9rem}
.tlist li{padding:2px 0}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.sw{display:flex;gap:8px;flex-wrap:wrap;padding-top:4px}
.swb{width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0}
.swb.on{border-color:var(--text)}
.pd{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:8px;padding:9px 0;cursor:pointer}
.pd.off{opacity:.3;cursor:default;background:none}
.pd.cur{border-style:dashed}
.pd.sel{background:var(--accent);color:var(--accent-text);border-color:var(--accent);font-weight:700}
@media(max-width:480px){.task{flex-wrap:wrap}.task .tl{flex-basis:100%}.mvs{margin-left:34px}}
.folder{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;padding:0 12px 10px;background:var(--bg)}
.folder>summary{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:4px 10px;padding:12px 0;cursor:pointer;list-style:none;font-weight:600}
.folder>summary::-webkit-details-marker{display:none}
.folder[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
</style>
</head>
<body>
<main id="app"></main>
<div id="modal"></div>
<nav>
  <button data-p="today">Heute</button>
  <button data-p="cal">Kalender</button>
  <button data-p="set">Einstellungen</button>
</nav>

<script>
/* ---------- Zustand ---------- */
const KEY = 'lernmehr-v1';
const fresh = () => ({ subjects:[], topics:[], freeDays:[], done:{}, moves:{}, dayLimit:0, subjectsPerDay:2, unit:'tasks' });
/* Gespeicherte Daten laden: „unit“ bewusst nicht vorbelegen, damit alte Zeit-Daten umgerechnet werden */
const withDefaults = d => { const b = fresh(); delete b.unit; return Object.assign(b, d); };
/* Deutlich unterscheidbare Fachfarben (funktionieren in hell und dunkel) */
const PALETTE = ['#4f6df5','#f2a007','#2fb27a','#d63384','#9b59d0','#14b8c4','#f97316','#84a62a','#e5484d','#7c8599'];
const nextColor = subjects => { const used = new Set(subjects.map(s=>s.color)); return PALETTE.find(c=>!used.has(c)) || PALETTE[subjects.length % PALETTE.length]; };
let S = load();
let page = 'today';
let calMonth = new Date(); calMonth.setDate(1);
let selDay = null;

function newSubject(name, o={}){
  return { id:'s'+Date.now().toString(36)+Math.random().toString(36).slice(2,5), name, examDate:'', repeats:3, ramp:'rising', ...o };
}
function getSubject(name){
  let s = S.subjects.find(x=>x.name.toLowerCase()===name.toLowerCase());
  if(!s){ s = newSubject(name,{color:nextColor(S.subjects)}); S.subjects.push(s); }
  return s;
}
/* Alte Daten (ein Prüfungsdatum für alles, Fach als Vorsatz im Themennamen) in Fächer umwandeln */
function migrate(s){
  s.subjects ||= []; s.topics ||= []; s.freeDays ||= []; s.done ||= {}; s.moves ||= {}; s.dayLimit = +s.dayLimit || 0;
  if(s.subjectsPerDay === undefined) s.subjectsPerDay = 2;
  const legacy = s.topics.some(t=>!t.subjectId);
  if(legacy){
    for(const t of s.topics){
      if(t.subjectId) continue;
      const m = t.name.match(/^(.{1,40}?):\s+(.+)$/), subjName = m ? m[1].trim() : 'Allgemein';
      if(m) t.name = m[2];
      let sub = s.subjects.find(x=>x.name.toLowerCase()===subjName.toLowerCase());
      if(!sub){ sub = newSubject(subjName,{examDate:s.examDate||'', repeats:s.repeats ?? 2, tasksPerDay:Math.max(1, Math.round((s.minutes||60)/45)), ramp:'flat'}); s.subjects.push(sub); }
      t.subjectId = sub.id;
    }
    if(s.subjects.length>1 && !s.dayLimit) s.dayLimit = s.minutes||0;   // bisherige Tageszeit wird zum Gesamtlimit
  }
  for(const sub of s.subjects) if(!sub.color) sub.color = nextColor(s.subjects);      // jedes Fach bekommt eine eigene Farbe
  // Zeiteinheiten abschaffen: Minuten pro Tag → Aufgaben pro Tag (ca. 45 Minuten = 1 Aufgabe)
  if(s.unit !== 'tasks'){
    for(const sub of s.subjects){ if(sub.tasksPerDay === undefined) sub.tasksPerDay = Math.max(1, Math.round((+sub.minutes||60)/45)); delete sub.minutes; }
    s.dayLimit = s.dayLimit ? Math.max(1, Math.round(s.dayLimit/45)) : 0;
    for(const t of s.topics) delete t.min;
    delete s.minutes; s.unit = 'tasks';
  }
  return s;
}
function load(){
  try{ return migrate(withDefaults(JSON.parse(localStorage.getItem(KEY)||'{}'))); }
  catch(e){   // Fehler beim Laden: Rohdaten sichern, damit beim nächsten Speichern nichts verloren geht
    try{ const raw = localStorage.getItem(KEY); if(raw) localStorage.setItem(KEY+'-backup', raw); }catch(_){}
    return fresh();
  }
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- Datum-Helfer ---------- */
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d,12); };
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return iso(d); };
const todayIso = () => iso(new Date());
const diffDays = (a,b) => Math.round((parse(b)-parse(a))/864e5);
const fmt = (s,o) => parse(s).toLocaleDateString('de-DE',o);
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Farbe eines Fachs (Parameter = Fach-ID); Ersatzfarbe, falls keine gesetzt ist */
const hue = id => { const s = S.subjects.find(x=>x.id===id); if(s && s.color) return s.color; let h=0; for(const c of String(id)) h=(h*31+c.charCodeAt(0))%360; return `hsl(${h} 65% 55%)`; };
const nAufg = n => `${n} ${n===1?'Aufgabe':'Aufgaben'}`;

/* ---------- Planung ---------- */
const RAMP = { flat:0, rising:1, strong:3 };
const RAMP_LABEL = { flat:'Gleichmäßig', rising:'Steigend', strong:'Stark steigend' };
const subOf = id => S.subjects.find(s=>s.id===id);
function roundLabel(r){ return r===0 ? 'Lernen' : `Wiederholung ${r}`; }

function subjectSessions(sub){
  // Jedes Thema = eine Aufgabe pro Durchgang (Lernen + Wiederholungen); „min“ ist nur das Gewicht 1
  const list = [], topics = S.topics.filter(t=>t.subjectId===sub.id);
  for(let r=0;r<=sub.repeats;r++){
    for(const t of topics){
      list.push({ key:`${t.id}:${r}:0`, subjectId:sub.id, topicId:t.id, name:t.name, round:r, part:0, parts:1, min:1 });
    }
  }
  return list;
}
const allSessions = () => S.subjects.flatMap(subjectSessions);

function computePlan(){
  const today = todayIso();
  const sessions = allSessions(), byKey = Object.fromEntries(sessions.map(s=>[s.key,s]));
  const days = {}, add = (d,t)=>{ (days[d] ||= []).push(t); };

  // Erledigt an einem vergangenen Tag = Verlauf. Heute oder im Voraus Erledigtes bleibt fest an seinem Tag
  // und zählt im Plan weiter mit – so rutscht nichts nach vorne, wenn man etwas abhakt.
  const doneAllBy = {};
  for(const [k,d] of Object.entries(S.done)){
    const s = byKey[k]; if(!s || d>=today) continue;
    add(d,{...s,done:true});
  }
  const isHistory = s => S.done[s.key] && S.done[s.key] < today;

  const info = { pendingMin:0, overflow:0, unscheduled:0, subjects:{}, noDate:[] };
  const plans = [];
  for(const sub of S.subjects){
    const pending = sessions.filter(s=>s.subjectId===sub.id && !isHistory(s));
    const pm = pending.filter(s=>!S.done[s.key]).reduce((a,s)=>a+s.min,0);
    const si = info.subjects[sub.id] = { pending:pm, overflow:0, availDays:0, daysLeft:null, status:'ok' };
    if(!sub.examDate){ si.status='nodate'; if(pm){ info.noDate.push(sub.name); info.pendingMin += pm; } continue; }
    si.daysLeft = diffDays(today, sub.examDate);
    if(si.daysLeft<=0){ si.status='past'; continue; }
    info.pendingMin += pm;
    const avail = [];
    for(let d=today; diffDays(d,sub.examDate)>0; d=addDays(d,1)) if(!S.freeDays.includes(d)) avail.push(d);
    si.availDays = avail.length;
    plans.push({ sub, pending, avail, k:RAMP[sub.ramp] ?? 0 });
  }
  const dayList = [...new Set(plans.flatMap(p=>p.avail))].sort();

  // Tag für Tag automatisch verteilen: jedes Fach gleichmäßig (bzw. steigend) auf seine verfügbaren Tage
  const out = {}, q = {}, rest = {};
  const pins = {}, away = {};                           // vom Nutzer verschobene Themen: fester Tag / entlasteter Tag
  for(const p of plans){
    const id = p.sub.id; q[id] = []; pins[id] = {}; away[id] = {};
    for(const s of p.pending){
      const mv = S.moves[s.key], dd = S.done[s.key];
      if(dd && p.avail.includes(dd)) (pins[id][dd] ||= []).push(s);        // erledigt: bleibt an seinem Tag
      else if(mv && p.avail.includes(mv.to)){
        (pins[id][mv.to] ||= []).push(s);
        for(const f of mv.from) away[id][f] = (away[id][f]||0) + s.min;   // am alten Tag nicht wieder auffüllen
      } else q[id].push(s);
    }
    rest[id] = p.pending.reduce((a,s)=>a+s.min,0);
  }
  for(const d of dayList){
    const active = plans.filter(p=>p.avail.includes(d)).sort((a,b)=>a.sub.examDate.localeCompare(b.sub.examDate));
    // Nicht jedes Fach jeden Tag: nur die dringendsten (plus verschobene und Fächer am letzten Lerntag) kommen dran
    const withWork = active.filter(p=>q[p.sub.id].length || (pins[p.sub.id][d]||[]).length);
    const perDay = +S.subjectsPerDay || 0, selecting = perDay>0 && withWork.length>perDay;
    const isLast = p => p.avail.indexOf(d) === p.avail.length-1;
    const urg = p => rest[p.sub.id] / (p.avail.length-p.avail.indexOf(d));       // offene Themen pro verbleibendem Tag
    let chosen = withWork;
    if(selecting){
      const forced = withWork.filter(p=>(pins[p.sub.id][d]||[]).length || isLast(p));
      const others = withWork.filter(p=>!forced.includes(p)).sort((a,b)=>urg(b)-urg(a) || a.sub.examDate.localeCompare(b.sub.examDate));
      chosen = [...forced, ...others.slice(0,Math.max(0,perDay-forced.length))]
        .sort((a,b)=>a.sub.examDate.localeCompare(b.sub.examDate));
    }
    const share = perDay>0 ? Math.min(1, perDay/Math.max(1,withWork.length)) : 1;
    for(const p of chosen){
      const id = p.sub.id, n = p.avail.length, i = p.avail.indexOf(d), last = i===n-1;
      const w = j => 1 + p.k*(n>1 ? j/(n-1) : 0);          // Gewicht steigt Richtung Prüfung
      let sumW = 0; for(let j=i;j<n;j++) sumW += w(j);
      let target = Math.round(rest[id]*w(i)/(sumW*share));
      if(selecting) target = Math.max(1,target);            // wer drankommt, lernt auch etwas
      if(last) target = rest[id];                           // am letzten Lerntag muss alles Übrige untergebracht werden
      let used = 0;
      for(const s of (pins[id][d]||[])){ (out[d] ||= []).push({...s,done:!!S.done[s.key],moved:!!S.moves[s.key] && !S.done[s.key]}); used += s.min; rest[id] -= s.min; }
      const lighter = last ? 0 : (away[id][d] || 0);
      if(lighter){ target -= lighter; if(target<=0) continue; }
      while(q[id].length){
        const s = q[id][0];
        if(used+s.min > target) break;
        (out[d] ||= []).push({...s,done:!!S.done[s.key]}); used += s.min; rest[id] -= s.min; q[id].shift();
      }
    }
  }
  const res = {out,q};
  for(const [d,ts] of Object.entries(res.out)) ts.forEach(t=>add(d,t));
  for(const p of plans){
    const left = res.q[p.sub.id]; if(!left.length) continue;
    const miss = left.reduce((a,s)=>a+s.min,0), si = info.subjects[p.sub.id];
    si.overflow = miss; info.overflow += miss;
    const last = p.avail[p.avail.length-1];
    if(last) left.forEach(s=>add(last,{...s,done:!!S.done[s.key],over:!S.done[s.key]}));
    else { info.unscheduled += left.filter(s=>!S.done[s.key]).length; si.status='noroom'; }
  }
  // Erledigtes, das im Plan keinen Platz mehr hat (z. B. Fach ohne Datum), bleibt trotzdem an seinem Tag sichtbar
  const placed = new Set(Object.values(days).flat().map(t=>t.key));
  for(const [k,d] of Object.entries(S.done)){ const s = byKey[k]; if(s && !placed.has(k)) add(d,{...s,done:true}); }
  return {days,info};
}

/* ---------- Rendering ---------- */
const app = document.getElementById('app');

function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.p===page));
  const plan = computePlan();
  app.innerHTML = page==='today' ? viewToday(plan) : page==='cal' ? viewCal(plan) : viewSettings();
  renderModal();
  window.scrollTo(0,0 + (page==='cal'?window.scrollY:0));
  if(celebrate){ const k = celebrate; celebrate = null; requestAnimationFrame(()=>cheer(k)); }
}

const ready = () => S.topics.length && S.subjects.some(s=>s.examDate);
const examsOn = d => S.subjects.filter(s=>s.examDate===d).map(s=>s.name);
const lastExam = () => S.subjects.map(s=>s.examDate).filter(Boolean).sort().pop() || '';

function setupHint(){
  return `<div class="card empty"><h2>Noch kein Lernplan</h2>
    <p class="muted">Lege in den Einstellungen deine Fächer mit Prüfungsdatum an und füge deine Themen hinzu. Den Rest plant die App.</p>
    <button class="btn primary" onclick="go('set')">Zu den Einstellungen</button></div>`;
}

function taskHtml(t,editable=true,day=''){
  const sub = subOf(t.subjectId);
  const canMove = !t.done && day && day>=todayIso();
  const mv = canMove ? `<span class="mvs"><button class="btn mv" onclick="moveTask('${t.key}','${day}')" title="Auf den nächsten Lerntag verschieben">${day===todayIso()?'Morgen':'Nächster Tag'} ›</button>
    <button class="btn mv" onclick="openMovePicker('${t.key}','${day}')" title="Tag zum Verschieben wählen" aria-label="Tag zum Verschieben wählen">📅</button></span>` : '';
  const pinned = t.moved ? `<button class="tag" onclick="unmoveTask('${t.key}')" title="Verschiebung aufheben">verschoben ✕</button>` : '';
  const line = `${sub?esc(sub.name)+' · ':''}${roundLabel(t.round)}`;
  // Buttons und Datumsfeld liegen außerhalb des Labels, sonst löst ein Tipp darauf das Abhaken (und ein Neuzeichnen) aus
  return `<div class="task ${t.done?'done':''}" data-key="${t.key}" style="--c:${hue(t.subjectId)}">
    <label class="tl">
      ${editable?`<input type="checkbox" ${t.done?'checked':''} onchange="toggleDone('${t.key}','${day||todayIso()}')">`:''}
      <div class="t"><div>${esc(t.name)}</div><div class="small muted">${line}</div></div>
    </label>
    ${t.over?'<span class="tag over">Zu voll</span>':''}${pinned}${mv}
  </div>`;
}

function subProgress(sub){
  const all = subjectSessions(sub), tot = all.reduce((a,s)=>a+s.min,0);
  return tot ? Math.round(all.filter(s=>S.done[s.key]).reduce((a,s)=>a+s.min,0)/tot*100) : 0;
}

function viewToday(plan){
  if(!ready()) return `<h1>Heute</h1>${setupHint()}`;
  const today = todayIso(), {info} = plan;
  const tasks = plan.days[today] || [];
  const isFree = S.freeDays.includes(today);
  const nDone = tasks.filter(t=>t.done).length, pctToday = tasks.length ? Math.round(nDone/tasks.length*100) : 0;
  const exToday = examsOn(today);

  let body;
  if(isFree) body = `<div class="card empty"><h2>Heute ist lernfrei 🎉</h2><p class="muted">Der Plan wurde auf die übrigen Tage verteilt. Aufheben kannst du das im Kalender.</p></div>`;
  else if(!tasks.length) body = `<div class="card empty"><h2>Für heute ist nichts geplant ✅</h2><p class="muted">${info.pendingMin?'Die nächsten Themen findest du im Kalender.':'Du hast alles geschafft!'}</p></div>`;
  else body = `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px">
      <h2 style="margin:0">Heute zu erledigen</h2><span class="muted small">${nDone} / ${tasks.length}</span></div>
      ${tasks.map(t=>taskHtml(t,true,today)).join('')}</div>`;

  // Statistik nur für heute
  const stats = (isFree || !tasks.length) ? '' : `<div class="card"><div class="stats">
      <div class="stat"><b>${pctToday}%</b><span class="small muted">heute geschafft</span></div>
      <div class="stat"><b>${nDone} / ${tasks.length}</b><span class="small muted">Themen erledigt</span></div></div>
      <div class="bar"><div style="width:${pctToday}%"></div></div></div>`;
  return `<h1>Heute</h1><p class="muted">${fmt(today,{weekday:'long',day:'numeric',month:'long'})}</p>
    ${exToday.length?`<div class="notice ok">Heute Prüfung: <b>${exToday.map(esc).join(', ')}</b> – viel Erfolg! 🍀</div>`:''}
    ${stats}
    ${tasks.length && nDone===tasks.length ? '<div class="notice ok" style="text-align:center"><b>Alles für heute geschafft! 🎉</b><br><span class="small">Richtig stark – gönn dir eine Pause.</span></div>' : ''}
    ${body}`;
}

/* Statistik über die ganze Zeit (Kalender-Seite) */
function overviewHtml(info){
  const today = todayIso();
  const next = S.subjects.filter(s=>s.examDate && diffDays(today,s.examDate)>0).sort((a,b)=>a.examDate.localeCompare(b.examDate))[0];
  const all = allSessions(), totalMin = all.reduce((a,s)=>a+s.min,0);
  const doneMin = all.filter(s=>S.done[s.key]).reduce((a,s)=>a+s.min,0);
  const pct = totalMin ? Math.round(doneMin/totalMin*100) : 0;
  return `<div class="card"><div class="stats">
      <div class="stat"><b>${next?diffDays(today,next.examDate):'–'}</b><span class="small muted">${next?`Tage bis ${esc(next.name)}`:'keine Prüfung offen'}</span></div>
      <div class="stat"><b>${pct}%</b><span class="small muted">insgesamt geschafft</span></div>
      <div class="stat"><b>${info.pendingMin}</b><span class="small muted">${info.pendingMin===1?'Thema':'Themen'} noch offen</span></div></div>
      <div class="bar"><div style="width:${pct}%"></div></div></div>`;
}
function examsHtml(){
  const today = todayIso(), exams = S.subjects.filter(s=>s.examDate).sort((a,b)=>a.examDate.localeCompare(b.examDate));
  if(!exams.length) return '';
  return `<div class="card"><h2 style="margin-bottom:4px">Deine Prüfungen</h2><p class="small muted" style="margin:0 0 12px">Tippe auf ein Fach für den Überblick über alle Themen und Wiederholungen.</p>${exams.map(s=>{
    const dl = diffDays(today,s.examDate), p = subProgress(s);
    return `<div class="exrow" onclick="openOverview('${s.id}')" role="button" tabindex="0"><div class="row" style="justify-content:space-between"><b>${esc(s.name)} ›</b>
      <span class="small muted">${fmt(s.examDate,{weekday:'short',day:'numeric',month:'short'})} · ${dl>0?`noch ${dl} ${dl===1?'Tag':'Tage'}`:dl===0?'heute':'vorbei'}</span></div>
      <div class="bar" style="margin-top:6px"><div style="width:${p}%;background:${hue(s.id)}"></div></div>
      <div class="small muted" style="margin-top:2px">${p}% geschafft</div></div>`;
  }).join('')}</div>`;
}

function warnHtml(info){
  let h = '';
  const bad = S.subjects.filter(s=>info.subjects[s.id] && info.subjects[s.id].status==='noroom');
  if(bad.length){
    h += `<div class="notice"><b>Es gibt keinen freien Lerntag mehr.</b><br>${bad.map(s=>`${esc(s.name)}: Vor der Prüfung ist kein Lerntag übrig.`).join('<br>')}<br><span class="small">Hebe Lernfrei-Tage auf oder prüfe das Prüfungsdatum.</span></div>`;
  }
  if(info.noDate.length) h += `<div class="notice">Für <b>${info.noDate.map(esc).join(', ')}</b> fehlt noch das Prüfungsdatum – ${info.noDate.length>1?'diese Fächer sind':'dieses Fach ist'} noch nicht im Plan.</div>`;
  return h;
}

function viewCal(plan){
  if(!ready()) return `<h1>Kalender</h1>${setupHint()}`;
  const y = calMonth.getFullYear(), m = calMonth.getMonth(), today = todayIso();
  const first = new Date(y,m,1,12), offset = (first.getDay()+6)%7, nDays = new Date(y,m+1,0).getDate();
  let cells = ['Mo','Di','Mi','Do','Fr','Sa','So'].map(d=>`<div class="dow">${d}</div>`).join('');
  for(let i=0;i<offset;i++) cells += '<div></div>';
  for(let d=1; d<=nDays; d++){
    const s = `${y}-${pad(m+1)}-${pad(d)}`;
    const tasks = plan.days[s] || [], free = S.freeDays.includes(s), ex = examsOn(s);
    const show = ex.length ? 2 : 3;
    const chips = tasks.slice(0,show).map(t=>`<span class="chip ${t.done?'d':''}" style="--c:${hue(t.subjectId)}">${esc(t.name)}</span>`).join('') + (tasks.length>show?`<span class="muted">+${tasks.length-show}</span>`:'');
    cells += `<button class="day ${free?'free':''} ${s===today?'today':''} ${s===selDay?'sel':''} ${ex.length?'exam':''}" onclick="selectDay('${s}')">
      <span class="n">${d}</span>${ex.length?`<span class="chip" style="--c:var(--danger)">${ex.map(esc).join(', ')}</span>`:''}${free?'<span class="muted">frei</span>':chips}
      ${tasks.length&&!free?`<span class="muted m">${tasks.filter(t=>t.done).length}/${tasks.length}</span>`:''}</button>`;
  }
  const title = calMonth.toLocaleDateString('de-DE',{month:'long',year:'numeric'});
  return `<h1>Kalender</h1>${warnHtml(plan.info)}${overviewHtml(plan.info)}
    <div class="card"><div class="cal-head"><button class="btn" onclick="moveMonth(-1)">‹</button><b>${title}</b><button class="btn" onclick="moveMonth(1)">›</button></div>
    <div class="cal">${cells}</div></div>${dayDetail(plan)}${examsHtml()}`;
}

function dayDetail(plan){
  if(!selDay) return '<p class="muted small" style="text-align:center">Tippe auf einen Tag für Details oder um ihn lernfrei zu markieren.</p>';
  const today = todayIso(), tasks = plan.days[selDay] || [], free = S.freeDays.includes(selDay);
  const ex = examsOn(selDay), canToggle = selDay>=today && selDay<lastExam();
  return `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">${fmt(selDay,{weekday:'long',day:'numeric',month:'long'})}</h2>
    ${canToggle?`<button class="btn ${free?'':'danger'}" onclick="toggleFree('${selDay}')">${free?'Lernfrei aufheben':'Lernfrei machen'}</button>`:''}</div>
    ${ex.length?`<p>Prüfung: <b>${ex.map(esc).join(', ')}</b> 🍀</p>`:''}
    ${free?'<p class="muted">Lernfreier Tag – keine Themen.</p>':tasks.length?tasks.map(t=>taskHtml(t,true,selDay)).join(''):(ex.length?'':'<p class="muted">Keine Themen an diesem Tag.</p>')}</div>`;
}

let openSubj = new Set(), openTopics = new Set(), openColors = new Set();
function toggleColors(el){ el.open ? openColors.add(el.dataset.s) : openColors.delete(el.dataset.s); }
function pickColor(id,c){ openColors.delete(id); setSub(id,'color',c); }       // nach der Wahl klappt die Auswahl wieder zu
function toggleTopics(el){ el.open ? openTopics.add(el.dataset.s) : openTopics.delete(el.dataset.s); }
function go(p){ page=p; render(); }
/* Abhaken: die Aufgabe bleibt an dem Tag stehen, an dem sie geplant war (auch im Voraus erledigt) */
function toggleDone(key,day){
  if(S.done[key]) delete S.done[key]; else { S.done[key]=day||todayIso(); delete S.moves[key]; celebrate = key; }
  save(); render();
}

/* ---------- Belohnungs-GIF (eigene Datei oder Link, getrennt vom Plan gespeichert) ---------- */
const GIFKEY = 'lernmehr-gif';
let gifCfg = (() => { try{ return Object.assign({src:'',mode:'each'}, JSON.parse(localStorage.getItem(GIFKEY)||'{}')); }catch(e){ return {src:'',mode:'each'}; } })();
function saveGif(){ try{ localStorage.setItem(GIFKEY, JSON.stringify(gifCfg)); return true; }catch(e){ return false; } }
function pickGifFile(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ alert('Bitte wähle ein GIF oder ein Bild.'); return; }
  if(file.size > 3*1024*1024){ alert('Die Datei ist zu groß (maximal 3 MB). Nimm ein kleineres GIF oder füge einen Link ein.'); return; }
  const r = new FileReader();
  r.onload = () => { const old = gifCfg.src; gifCfg.src = r.result; if(!saveGif()){ gifCfg.src = old; alert('Das GIF konnte nicht gespeichert werden (Speicher voll). Nimm ein kleineres GIF oder füge einen Link ein.'); } render(); };
  r.readAsDataURL(file);
}
function pickGifLink(){
  const url = (prompt('Link zum GIF einfügen (https://…):', gifCfg.src.startsWith('http') ? gifCfg.src : '') || '').trim();
  if(!url) return;
  if(!/^https?:\/\//i.test(url)){ alert('Der Link muss mit https:// beginnen.'); return; }
  gifCfg.src = url; saveGif(); render();
}
function removeGif(){ gifCfg.src = ''; saveGif(); render(); }
function setGifMode(m){ gifCfg.mode = m; saveGif(); render(); }
function showGif(){
  if(!gifCfg.src || reducedMotion()) return;
  document.querySelectorAll('.gifpop').forEach(e=>e.remove());
  const box = document.createElement('div'); box.className = 'gifpop'; box.onclick = () => box.remove();
  const img = new Image(); img.alt = ''; img.onerror = () => box.remove(); img.src = gifCfg.src;
  box.appendChild(img); document.body.appendChild(box);
  setTimeout(()=>box.classList.add('out'), 2600); setTimeout(()=>box.remove(), 3100);
}

/* ---------- GIF-Suche über Giphy (eigener API-Schlüssel, nur auf diesem Gerät gespeichert) ---------- */
/* Den kostenlosen Giphy-API-Schlüssel trägt der Betreiber der App EINMAL hier ein (developers.giphy.com → Create an App → API).
   Nutzer müssen sich nirgends anmelden. Solange das Feld leer ist, wird die GIF-Suche nicht angeboten. */
const GIPHY_KEY = '17NAzml7tSiFi4Hs7Ju4KX6YUNkhVHb4';
let gs = null;
function openGifSearch(){ if(!GIPHY_KEY) return; gs = { q:'', results:[], status:'', loading:false }; renderModal(); gifSearch(''); }
function closeGifSearch(){ gs = null; renderModal(); }
async function gifSearch(q){
  if(!gs) return;
  gs.q = q; gs.loading = true; gs.status = q ? 'Suche …' : 'Beliebte GIFs werden geladen …'; renderModal();
  const base = 'https://api.giphy.com/v1/gifs/' + (q ? 'search' : 'trending');
  const url = `${base}?api_key=${encodeURIComponent(GIPHY_KEY)}&limit=24&rating=g${q?`&q=${encodeURIComponent(q)}&lang=de`:''}`;
  try{
    const r = await fetch(url);
    if(r.status===401 || r.status===403){ if(!gs) return; gs.results = []; gs.status = 'Die GIF-Suche ist gerade nicht verfügbar (Giphy hat die Anfrage abgelehnt). Versuch es später nochmal oder wähle eine Datei.'; gs.loading = false; return renderModal(); }
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json(); if(!gs) return;
    gs.results = (j.data||[]).map(g=>({ id:g.id, title:g.title||'GIF',
      thumb:(g.images.fixed_width_small||g.images.fixed_width||g.images.downsized).url,
      url:(g.images.downsized||g.images.fixed_width||g.images.original).url }));
    gs.status = gs.results.length ? '' : 'Nichts gefunden – versuch einen anderen Suchbegriff.';
  }catch(e){ if(!gs) return; gs.results = []; gs.status = 'Keine Verbindung zu Giphy. Prüfe dein Internet und versuche es nochmal.'; }
  gs.loading = false; renderModal();
}

function burst(x,y,n,opts={}){

    p.style.setProperty('--x', x+'px'); p.style.setProperty('--y', y+'px');
    p.style.setProperty('--dx', Math.cos(ang)*dist+'px'); p.style.setProperty('--up', Math.sin(ang)*dist+'px');

const LIBS = {

  pdfWorker: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js',
  tess: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js'
};
const scriptCache = {};
function loadScript(url){
  return scriptCache[url] ||= new Promise((res,rej)=>{
    const s = document.createElement('script'); s.src = url; s.onload = res;
    s.onerror = ()=>{ delete scriptCache[url]; rej(new Error('Bibliothek konnte nicht geladen werden (Internet?)')); };
    document.head.appendChild(s);
  });
}
function setStatus(t){ if(wiz){ wizStatus(t); } }

let ocrWorker = null;
async function ocr(src){
  await loadScript(LIBS.tess);
  if(!ocrWorker){ setStatus('Texterkennung wird vorbereitet (einmaliger Download) …'); ocrWorker = await Tesseract.createWorker('deu'); }
  const r = await ocrWorker.recognize(src);
  return r.data.text;
}

async function pdfText(file){
  await loadScript(LIBS.pdf);
  if(!pdfjsLib.GlobalWorkerOptions.workerSrc.startsWith('blob:')){
    const code = await (await fetch(LIBS.pdfWorker)).text();
    pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
  }
  const pdf = await pdfjsLib.getDocument({data: await file.arrayBuffer()}).promise;
  let out = '';
  for(let p=1;p<=pdf.numPages;p++){
    setStatus(`${file.name}: Seite ${p} von ${pdf.numPages} …`);
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    const rows = {};
    for(const it of tc.items){ if(!it.str.trim()) continue; const k = Math.round(it.transform[5]/4); (rows[k] ||= []).push(it); }
    let txt = Object.keys(rows).map(Number).sort((a,b)=>b-a)
      .map(k=>rows[k].sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' ')).join('\n');
    if((txt.match(/\p{L}/gu)||[]).length < 15){            // kein Textlayer → Seite als Bild lesen
      const vp = page.getViewport({scale:2.5}), cv = document.createElement('canvas');
      cv.width = vp.width; cv.height = vp.height;
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
      setStatus(`${file.name}: Seite ${p} wird per Texterkennung gelesen …`);
      txt = await ocr(cv);
    }
    out += txt + '\n';
  }
  return out;
}

const STOP = /^(lernplan|thema|meine lernnotizen|offene fragen|notizen|seite\s*\d|inhalt|inhaltsverzeichnis)\b|viermal lernen|abhaken|goodnotes|\d{1,2}:\d{2}/i;
function cleanLine(l){
  const t = l.replace(/[□■☐☑☒✓✔▪●○]/g,' ').replace(/^\s*(#+|[-*•·]|\d+[.)])\s*/,'').replace(/[*_`|]/g,' ').replace(/\s+/g,' ').trim();
  // Reste von Kästchen/Tabellenspalten am Zeilenende (z. B. "[ [1 =") abschneiden
  const tok = t.split(' ');
  while(tok.length>1 && /^(?:[^\p{L}\d]+.*|[^\p{L}]*\p{Ll}[^\p{L}]*|[^\p{L}]+\p{Lu}[^\p{L}]*|.*[\[\]=]+.*)$/u.test(tok[tok.length-1]) && !(/\p{L}/u.test(tok[tok.length-1]) && /[?!.:)]$/.test(tok[tok.length-1])) ) tok.pop();
  return tok.join(' ');
}
function candidates(text){
  const seen = new Set(), res = [];
  for(const raw of text.split(/\r?\n/)){
    const t = cleanLine(raw);
    if(!t || seen.has(t.toLowerCase())) continue;
    seen.add(t.toLowerCase());
    const letters = (t.match(/\p{L}/gu)||[]).length;
    const on = t.length>=5 && t.length<=90 && letters/t.length>=0.7 && !STOP.test(t) && !/^[\d\s.,-]+$/.test(t);
    res.push({t,on});
  }
  return res;
}
function prefixFromName(n){
  return n.replace(/\.[^.]+$/,'').replace(/^lernplan[\s_-]*/i,'').replace(/[_-]+/g,' ').replace(/\s*\(\d+\)$/,'').trim();
}

function addTopics(sub, items){   // items: [{name,min}]

  for(const it of items){
    const name = it.name.trim();
    if(!name || have.has(name.toLowerCase())) continue;
    have.add(name.toLowerCase());
    S.topics.push({id:'t'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)+n++, subjectId:sub.id, name});

        <span class="small muted">Ohne Datum wird das Fach noch nicht eingeplant.</span></label>
      <label class="f">Wiederholungen
        <select onchange="wiz.repeats=+this.value">${[0,1,2,3,4,5].map(n=>`<option value="${n}" ${wiz.repeats===n?'selected':''}>${n===0?'keine':n+'×'}</option>`).join('')}</select></label>
      <label class="f">Lernverlauf
        <select onchange="wiz.ramp=this.value">${Object.entries(RAMP_LABEL).map(([k,v])=>`<option value="${k}" ${wiz.ramp===k?'selected':''}>${v}</option>`).join('')}</select></label></div>`;
    foot = `<button class="btn" onclick="wizClose()">Abbrechen</button><button class="btn primary" onclick="wizNext()">Weiter</button>`;
  } else if(wiz.step===2){
    body = `<p class="small muted" style="margin:0 0 8px">Füge deinen Lernzettel ein (ein Thema pro Zeile) und/oder lade PDFs, Fotos oder Screenshots hoch. Alles wird nur auf deinem Gerät gelesen.</p>
      <textarea placeholder="Zellatmung&#10;Photosynthese&#10;Genetik" oninput="wiz.text=this.value">${esc(wiz.text)}</textarea>
      <div class="row" style="margin-top:10px"><button class="btn" onclick="document.getElementById('wfiles').click()">📎 Dateien auswählen</button>
        <input type="file" id="wfiles" multiple accept="application/pdf,image/*,.txt,.md" hidden onchange="wizFiles(this.files)"></div>
      <div id="wstatus" class="small muted" style="margin-top:8px">${esc(wiz.status)}</div>`;
    foot = `${sub?'':'<button class="btn" onclick="wizBackFix()">Zurück</button>'}<button class="btn" onclick="wizClose()">Abbrechen</button><button class="btn primary" onclick="wizNext()">Weiter</button>`;
  } else {
    body = `<p class="small muted" style="margin:0 0 8px">Prüfe die Liste. Überschriften und Störtext sind vorab abgewählt, bereits vorhandene Themen ebenfalls. Du kannst jedes Thema anpassen.</p>
      <div class="row" style="margin-bottom:8px"><button class="btn" onclick="wizAll(true)">Alle</button><button class="btn" onclick="wizAll(false)">Keine</button></div>
      ${wiz.lines.length ? `<div class="wlist">${wiz.lines.map((l,i)=>`<div class="topic" style="${l.on?'':'opacity:.55'}"><input type="checkbox" style="width:22px;flex:none" ${l.on?'checked':''} onchange="wiz.lines[${i}].on=this.checked;wizCount()">
        <input value="${esc(l.t)}" onchange="wiz.lines[${i}].t=this.value.trim()||wiz.lines[${i}].t">${l.dup?'<span class="tag">schon da</span>':''}</div>`).join('')}</div>`
        : '<p class="muted">Keine Themen gefunden. Gehe zurück und füge Text oder Dateien hinzu – du kannst das Fach auch ohne Themen speichern.</p>'}
      <p id="wcount" class="small muted" style="margin:8px 0 0"></p>`;
    foot = `<button class="btn" onclick="wizBackFix()">Zurück</button><button class="btn" onclick="wizClose()">Abbrechen</button><button class="btn primary" onclick="wizSave()">${sub?'Themen hinzufügen':'Fach speichern'}</button>`;
  }
  setTimeout(()=>{ if(wiz && wiz.step===3) wizCount(); },0);
  return `<div class="modal-bg"><div class="modal" style="max-width:520px">
    <div class="row" style="justify-content:space-between;align-items:flex-start;margin-bottom:6px"><div><h2 style="margin:0">${title}</h2>
      <p class="small muted" style="margin:2px 0 0">Schritt ${cur} von ${nSteps}</p></div></div>
    <div class="bar" style="margin:6px 0 12px"><div style="width:${cur/nSteps*100}%"></div></div>
    ${body}
    <div class="row" style="justify-content:flex-end;margin-top:14px">${foot}</div>
  </div></div>`;
}


/* Wischen im Kalender: links = nächster Monat, rechts = voriger Monat */
let swipe = null;
app.addEventListener('touchstart',e=>{ swipe = (page==='cal' && e.touches.length===1) ? {x:e.touches[0].clientX,y:e.touches[0].clientY} : null; },{passive:true});
app.addEventListener('touchend',e=>{
  if(!swipe || page!=='cal') return;
  const t = e.changedTouches[0], dx = t.clientX-swipe.x, dy = t.clientY-swipe.y; swipe = null;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) moveMonth(dx<0 ? 1 : -1);
},{passive:true});

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
render();
</script>
</body>
</html>
