let tg = null, tgSuppress = false;
function tgStart(target,x,y){
  if(page!=='set' || tg) return;
  const row = target && target.closest && target.closest('.topic[data-t]'); if(!row || target.closest('button')) return;
  const box = row.closest('details.topics'); if(!box || box.querySelectorAll('.topic[data-t]').length<2) return;
  const wait = target.closest('.grip') ? 120 : 380;
  tg = { row, box, x0:x, y0:y, y, active:false, timer:setTimeout(tgActivate, wait) };
}
function tgActivate(){
  if(!tg) return; tg.active = true;
  try{ navigator.vibrate && navigator.vibrate(15); }catch(e){}
  try{ document.activeElement && document.activeElement.blur(); window.getSelection().removeAllRanges(); }catch(e){}
  tg.row.classList.add('tgsrc'); tg.box.classList.add('tgmode');
}
function tgMove(x,y,e){
  if(!tg) return; tg.y = y;
  if(!tg.active){ if(Math.hypot(x-tg.x0,y-tg.y0) > 10){ clearTimeout(tg.timer); tg = null; } return; }   // früh bewegt: normales Scrollen
  if(e && e.cancelable) e.preventDefault();
  if(y < 70) window.scrollBy(0,-12); else if(y > window.innerHeight-130) window.scrollBy(0,12);          // am Rand automatisch scrollen
  const el = document.elementFromPoint(x,y), over = el && el.closest && el.closest('.topic[data-t]');
  if(over && over!==tg.row && over.parentNode===tg.row.parentNode){
    const r = over.getBoundingClientRect(), after = tg.row.compareDocumentPosition(over) & Node.DOCUMENT_POSITION_FOLLOWING;
    if(after && y > r.top + r.height*0.4) over.after(tg.row); else if(!after && y < r.bottom - r.height*0.4) over.before(tg.row);
  }
}
function tgEnd(cancelled){
  if(!tg) return; clearTimeout(tg.timer); const d = tg; tg = null;
  if(!d.active) return;
  d.row.classList.remove('tgsrc'); d.box.classList.remove('tgmode');
  tgSuppress = true; setTimeout(()=>{ tgSuppress = false; }, 120);                                          // Loslassen soll nichts anklicken
  if(cancelled){ render(); return; }
  const ids = [...d.box.querySelectorAll('.topic[data-t]')].map(r=>r.dataset.t), sid = (S.topics.find(t=>t.id===ids[0])||{}).subjectId;
  const slots = []; S.topics.forEach((t,i)=>{ if(t.subjectId===sid) slots.push(i); });
  const byId = Object.fromEntries(S.topics.map(t=>[t.id,t])); if(slots.length!==ids.length || ids.some(i=>!byId[i])){ render(); return; }
  const before = slots.map(i=>S.topics[i].id).join();
  if(before === ids.join()) return;
  ids.forEach((id,k)=>{ S.topics[slots[k]] = byId[id]; });
  save(true); render(); toast('Reihenfolge geändert – der Plan passt sich an');
}

function learnMood(plan){
  const today = todayIso(), fp = S.firstPlanned || {};
  if(!ready()) return {m:'start', backlog:0, open:0, total:0};
  const tasks = plan.days[today] || [], open = tasks.filter(t=>!t.done).length, total = tasks.length;
  let backlog = 0, pending = 0;
  for(const s of allSessions()){ if(S.done[s.key]) continue; pending++; const f = fp[s.key]; if(f && f<today) backlog++; }
  const ahead = Object.values(S.done).filter(d=>d>today).length;
  const base = {backlog, open, total, ahead, pending};
  if(examsOn(today).length) return {m:'pruefung', ...base};
  if(S.freeDays.includes(today)) return {m:'schlaf', ...base};
  if(backlog>5) return {m:'traurig', ...base};
  if(backlog>=3) return {m:'besorgt', ...base};
  if(backlog>=1) return {m:'okay', ...base};
  if((total>0 && open===0) || ahead>0 || pending===0) return {m:'stolz', ...base};
  return {m:'froh', ...base};
}

/* 3D-Gefühl: Bär dreht sich leicht, folgt dem Finger/Mauszeiger und lässt sich per Wischen drehen */
const tilt = {ry:0, rx:0, lookY:0, lookX:0, spin:0, drag:null, moved:false, raf:0, t0:0, on:false};
function startBearTilt(){
  if(!tilt.on){
    tilt.on = true;
    window.addEventListener('pointermove', e=>{
      const w = document.querySelector('.bearwrap'); if(!w) return;
      if(tilt.drag){ const dx = e.clientX - tilt.drag.x; if(Math.abs(dx)>3) tilt.moved = true; tilt.spin = Math.max(-40,Math.min(40,tilt.spin + dx*0.6)); tilt.drag.x = e.clientX; return; }
      const r = w.getBoundingClientRect(), cx = r.left + r.width/2, cy = r.top + r.height/2;
      tilt.lookY = Math.max(-1,Math.min(1,(e.clientX-cx)/(window.innerWidth/2)))*24;
      tilt.lookX = -Math.max(-1,Math.min(1,(e.clientY-cy)/(window.innerHeight/2)))*10;
    });
    document.addEventListener('pointerdown', e=>{ if(e.target.closest && e.target.closest('.bearwrap')){ tilt.drag = {x:e.clientX}; tilt.moved = false; } });
    const end = () => { tilt.drag = null; };
    window.addEventListener('pointerup', end); window.addEventListener('pointercancel', end);
    document.addEventListener('click', e=>{ if(tilt.moved && e.target.closest && e.target.closest('.bearwrap')){ e.stopPropagation(); e.preventDefault(); } tilt.moved = false; }, true);
  }
  if(!tilt.raf){ tilt.t0 = performance.now(); tilt.raf = requestAnimationFrame(bearTiltTick); }
}
function bearTiltTick(now){
  const b = document.querySelector('.bear3d');
  if(!b || document.visibilityState!=='visible'){ tilt.raf = 0; return; }
  const t = (now - tilt.t0)/1000, calm = reducedMotion() ? 0 : 1;
  if(!tilt.drag) tilt.spin *= 0.9;
  const ryT = Math.max(-50,Math.min(50,tilt.lookY*calm + Math.sin(t*0.9)*7*calm + tilt.spin)), rxT = tilt.lookX*calm + Math.sin(t*1.3)*1.5*calm;
  tilt.ry += (ryT - tilt.ry)*0.15; tilt.rx += (rxT - tilt.rx)*0.15;
  const y = Math.sin(t*1.8)*2*calm;
  b.style.transform = `translateY(${y}px) rotateX(${tilt.rx.toFixed(2)}deg) rotateY(${tilt.ry.toFixed(2)}deg)`;
  const sh = b.parentNode.querySelector('.bearshadow'); if(sh) sh.style.transform = `scaleX(${(1 - Math.min(Math.abs(tilt.ry),90)/260).toFixed(3)}) translateX(${(-tilt.ry*0.25).toFixed(1)}px)`;
  tilt.raf = requestAnimationFrame(bearTiltTick);
}

function bearCardHtml(plan){

function webglOk(){ try{ const c = document.createElement('canvas'); return !!(c.getContext('webgl') || c.getContext('experimental-webgl')); }catch(e){ return false; } }

function build3dBear(m){
  // Stil: Tusche-Umrisse + weiche Aquarell-Flächen (Toon-Schattierung), sitzender Bär mit Honigtopf
  const T = THREE, L = BEAR3D[m] || BEAR3D.froh, root = new T.Group(), parts = {eyes:[], extras:[]};
  if(!gl3.toonMap){ const g = new T.DataTexture(Uint8Array.from([150,195,235,255]),4,1,T.LuminanceFormat); g.minFilter = g.magFilter = T.NearestFilter; g.needsUpdate = true; gl3.toonMap = g; }
  const toon = (c,o={}) => new T.MeshToonMaterial(Object.assign({color:c, gradientMap:gl3.toonMap}, o));
  const ink = new T.MeshBasicMaterial({color:'#2A1E16', side:T.BackSide});
  const furM = toon(L.fur), creamM = toon('#FBE3A6'), darkM = new T.MeshBasicMaterial({color:'#241812'}), pinkM = toon('#F4A08E',{transparent:true,opacity:.6});
  const sph = new T.SphereGeometry(1,26,18);
  // Ellipsoid mit Tusche-Umriss (der Umriss ist eine etwas größere, nach innen gewendete Kopie)
  const ell = (m_,x,y,z,sx,sy,sz,outline=true,geo=sph) => { const g = new T.Group(); g.position.set(x,y,z); const me = new T.Mesh(geo,m_); me.scale.set(sx,sy,sz); g.add(me);
    if(outline){ const o = new T.Mesh(geo,ink); o.scale.set(sx*1.045+0.012,sy*1.045+0.012,sz*1.045+0.012); g.add(o); } return g; };
  const add = (parent,node) => { parent.add(node); return node; };
  // Körper, leicht nach hinten gelehnt
  const body = add(root, ell(furM,0,-0.85,-0.05,1.12,1.12,1.0)); body.rotation.x = -0.12; parts.body = body.children[0];
  const belly = add(root, ell(creamM,0,-0.95,0.68,0.7,0.76,0.34,false)); belly.rotation.x = -0.12;
  // Beine nach vorn, Fußsohlen heller
  [-1,1].forEach(s=>{ const leg = add(root, ell(furM,s*0.72,-1.62,0.95,0.46,0.42,0.72)); leg.rotation.y = s*-0.28;
    const sole = add(leg, ell(creamM,0,0.02,0.7,0.34,0.3,0.09,false)); sole.position.z = 0.7*0.72+0.02; });
  // Arme: Pivot an der Schulter
  const mkArm = s => { const g = new T.Group(); g.position.set(s*0.98,-0.35,0.25); g.add(ell(furM,s*0.1,-0.4,0.12,0.3,0.5,0.3)); root.add(g); return g; };
  parts.armL = mkArm(-1); parts.armR = mkArm(1);
  const armRest = L.pot ? [0.95,0.5] : [0.25,0.28]; parts.armRest = armRest;
  // Schal
  const scarf = new T.Mesh(new T.TorusGeometry(0.8,0.19,14,40), toon('#D9534F')); scarf.position.set(0,-0.08,0.05); scarf.rotation.x = Math.PI/2; scarf.scale.set(1,1,1.2); root.add(scarf);
  const scarfO = new T.Mesh(new T.TorusGeometry(0.8,0.19,14,40), ink); scarfO.position.copy(scarf.position); scarfO.rotation.copy(scarf.rotation); scarfO.scale.set(1.02,1.02,1.26); root.add(scarfO);
  add(root, ell(toon('#C0392B'),0.62,-0.42,0.78,0.2,0.46,0.12)).rotation.z = -0.25;
  // Kopf
  const head = new T.Group(); head.position.set(0,0.66,0); root.add(head); parts.head = head;
  head.add(ell(furM,0,0,0,1.0,0.92,0.96));
  [-1,1].forEach(s=>{ head.add(ell(furM,s*0.74,0.72,-0.05,0.3,0.3,0.2)); head.add(ell(toon('#EFB98A'),s*0.74,0.72,0.1,0.17,0.17,0.07,false)); });
  const snoutR = {x:0.46,y:0.34,z:0.4}, snoutC = {x:0,y:-0.16,z:0.82};
  head.add(ell(creamM,snoutC.x,snoutC.y,snoutC.z,snoutR.x,snoutR.y,snoutR.z,false));
  const snoutZ = (x,y) => { const q = 1 - Math.pow(x/snoutR.x,2) - Math.pow((y-snoutC.y)/snoutR.y,2); return snoutC.z + snoutR.z*Math.sqrt(Math.max(q,0)); };
  const nose = ell(darkM,0,0.0,snoutZ(0,0.0)-0.02,0.2,0.13,0.12,false); nose.rotation.z = 0.12; head.add(nose);
  const eyeY = 0.2, headZ = (x,y) => 0.96*Math.sqrt(Math.max(0, 1 - x*x - Math.pow(y/0.92,2)));
  [-1,1].forEach(s=>{
    const x = s*0.34, z = headZ(x,eyeY)+0.01;
    if(L.face==='open'){ const e = ell(darkM,x,eyeY,z,0.07,0.085,0.05,false); head.add(e); parts.eyes.push(e.children[0]);
      head.add(ell(new T.MeshBasicMaterial({color:'#ffffff'}),x+0.025,eyeY+0.035,z+0.04,0.022,0.022,0.022,false)); }
    else { const arc = new T.Mesh(new T.TorusGeometry(0.11,0.03,8,20,Math.PI),darkM); arc.position.set(x,eyeY+(L.face==='happy'?-0.04:0.04),z+0.02); arc.rotation.z = L.face==='happy' ? 0 : Math.PI; head.add(arc); }
    // kleine Augenbrauen-Striche wie in der Zeichnung; bei Sorge/Trauer schräg
    const slant = L.brows ? -s*L.brows : -s*0.12*(L.face==='closed'?0:1);
    const br = ell(darkM,x,eyeY+0.2,headZ(x,eyeY+0.2),0.12,0.026,0.03,false); br.rotation.z = slant; head.add(br);
    if(L.bags) head.add(ell(toon('#5B4A7A',{transparent:true,opacity:.35}),x,eyeY-0.15,headZ(x,eyeY-0.15)-0.01,0.14,0.05,0.04,false));
    if(L.cheeks){ const cx = s*0.62, c = ell(pinkM,cx,-0.12,headZ(cx,-0.12)-0.01,0.16,0.11,0.05,false); c.rotation.y = s*0.7; head.add(c); }
  });
  const pts = [];
  for(let i=-8;i<=8;i++){ const t = i/8, x = 0.22*t; let y;
    if(L.mouth==='smile') y = -0.24-0.1*(1-t*t)+0.1; else if(L.mouth==='frown') y = -0.24+0.1*(1-t*t)-0.08; else if(L.mouth==='wavy') y = -0.28+0.035*Math.sin(t*Math.PI*3); else y = -0.27;
    pts.push(new T.Vector3(x,y,snoutZ(x,y)+0.012)); }
  head.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3(pts),24,0.026,8,false),darkM));
  head.add(new T.Mesh(new T.TubeGeometry(new T.CatmullRomCurve3([new T.Vector3(0,-0.09,snoutZ(0,-0.09)+0.01),new T.Vector3(0,pts[8].y+0.03,snoutZ(0,pts[8].y)+0.012)]),4,0.022,8,false),darkM));
  if(L.messy){ [-0.2,0,0.2].forEach((x,i)=>{ const c = new T.Mesh(new T.CylinderGeometry(0.03,0.05,0.4,8),furM); c.position.set(x,1.0,0); c.rotation.z = (i-1)*-0.5; head.add(c); }); }
  if(L.cap){ const cap = new T.Group(); cap.position.set(0,0.82,0);
    const mk = (geo,c,y) => { const me = new T.Mesh(geo,toon(c)); me.position.y = y; cap.add(me); return me; };
    mk(new T.CylinderGeometry(0.5,0.58,0.3,20),'#2B2838',0.02);
    const board = mk(new T.BoxGeometry(1.7,0.08,1.7),'#2B2838',0.2); board.rotation.y = Math.PI/4;
    const cord = new T.Mesh(new T.CylinderGeometry(0.018,0.018,0.55,6),toon('#F2B233')); cord.position.set(0.55,0.0,0.55); cord.rotation.z = 0.2; cap.add(cord);
    const tas = new T.Mesh(new T.SphereGeometry(0.07,10,8),toon('#F2B233')); tas.position.set(0.6,-0.27,0.55); cap.add(tas); head.add(cap); }
  if(L.band){ const band = new T.Mesh(new T.TorusGeometry(0.9,0.075,10,36),toon('#D9534F')); band.position.set(0,0.42,-0.02); band.rotation.x = Math.PI/2; band.scale.set(1,1.02,0.96); head.add(band);
    head.add(ell(toon('#ffffff'),0,0.46,0.88,0.12,0.12,0.04,false)); }
  // Honigtopf (blaugrau, Bänder), Löffel, Honig und Tropfen
  if(L.pot){ const pot = new T.Group(); pot.position.set(0,-1.2,1.35); pot.scale.setScalar(0.95);
    const prof = [[0.01,-0.5],[0.34,-0.48],[0.55,-0.3],[0.62,0.0],[0.55,0.3],[0.38,0.48],[0.42,0.56],[0.4,0.62]].map(p=>new T.Vector2(p[0],p[1]));
    const lathe = new T.LatheGeometry(prof,28); pot.add(new T.Mesh(lathe,toon('#8FB6C2',{side:T.DoubleSide})));
    const potInk = new T.Mesh(lathe,ink); potInk.scale.setScalar(1.05); pot.add(potInk);
    [-0.2,0.05,0.28].forEach(y=>{ const r = 0.6-Math.abs(y)*0.18; const b = new T.Mesh(new T.TorusGeometry(r,0.018,6,32),toon('#6E98A6')); b.position.y = y; b.rotation.x = Math.PI/2; pot.add(b); });
    const honey = new T.Mesh(new T.CylinderGeometry(0.37,0.37,0.04,24),toon('#F2AE2E')); honey.position.y = 0.5; pot.add(honey);
    const dip = new T.Group(); dip.position.set(0.05,0.5,0.02); dip.rotation.z = 0.42; dip.rotation.x = -0.2;
    const stick = new T.Mesh(new T.CylinderGeometry(0.035,0.035,1.1,8),toon('#B4783C')); stick.position.y = 0.52; dip.add(stick);
    const head2 = new T.Mesh(new T.CylinderGeometry(0.1,0.1,0.22,10),toon('#C48A4A')); head2.position.y = 0.05; dip.add(head2);
    pot.add(dip);
    const drop = ell(toon('#F2AE2E',{transparent:true,opacity:.95}),0.05,0.4,0.05,0.045,0.07,0.045,false); pot.add(drop); parts.drop = drop;
    root.add(pot); parts.pot = pot;
    // Honigpfütze am Boden
    const pud = new T.Mesh(new T.CircleGeometry(1,24),new T.MeshBasicMaterial({color:'#F2B233',transparent:true,opacity:.85})); pud.rotation.x = -Math.PI/2; pud.position.set(-0.7,-2.08,1.7); pud.scale.set(0.55,0.32,1); root.add(pud); }
  if(L.sparkle){ for(let i=0;i<3;i++){ const sp = new T.Mesh(new T.OctahedronGeometry(0.1),new T.MeshBasicMaterial({color:'#FFD54A'})); sp.userData.i = i; root.add(sp); parts.extras.push(sp); } }
  if(L.sweat){ const d = new T.Group(); d.add(ell(new T.MeshBasicMaterial({color:'#8EC9F0',transparent:true,opacity:.85}),0,0,0,0.09,0.09,0.09,false)); const cn = new T.Mesh(new T.ConeGeometry(0.075,0.17,10),new T.MeshBasicMaterial({color:'#8EC9F0',transparent:true,opacity:.85})); cn.position.y = 0.14; d.add(cn); d.position.set(0.95,1.2,0.35); head.add(d); parts.sweat = d; }
  if(L.tear){ const d = new T.Mesh(sph,new T.MeshBasicMaterial({color:'#8EC9F0',transparent:true,opacity:.9})); d.scale.set(0.06,0.09,0.05); d.position.set(-0.42,0.05,0.93); head.add(d); parts.tear = d; }
  if(L.zzz){ const mk = (txt,size) => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d'); x.font = 'bold 100px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#6B7FD7'; x.fillText(txt,64,70);
      const sp = new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(c),transparent:true})); sp.scale.set(size,size,1); root.add(sp); return sp; };
    parts.zs = [mk('Z',0.6), mk('z',0.42), mk('z',0.3)]; }
  // weicher Schatten am Boden
  const sc = document.createElement('canvas'); sc.width = sc.height = 64; const sx = sc.getContext('2d'), gr = sx.createRadialGradient(32,32,2,32,32,30); gr.addColorStop(0,'rgba(60,40,20,.35)'); gr.addColorStop(1,'rgba(60,40,20,0)'); sx.fillStyle = gr; sx.fillRect(0,0,64,64);
  const shadow = new T.Mesh(new T.PlaneGeometry(3.8,2.6),new T.MeshBasicMaterial({map:new T.CanvasTexture(sc),transparent:true,depthWrite:false})); shadow.rotation.x = -Math.PI/2; shadow.position.set(0,-2.12,0.5); root.add(shadow);
  root.userData = {parts, look:L};
  if(L.fly){ shadow.visible = false;
    const bal = new T.Group(), redM = toon('#D8423A');
    bal.add(ell(redM,0,0,0,0.95,1.2,0.95)); const hl = ell(new T.MeshBasicMaterial({color:'#ffffff',transparent:true,opacity:.38}),-0.3,0.4,0.78,0.16,0.3,0.05,false); hl.rotation.z = 0.4; bal.add(hl);
    const knot = new T.Mesh(new T.ConeGeometry(0.16,0.28,10),toon('#B3302A')); knot.position.y = -1.3; knot.rotation.x = Math.PI; bal.add(knot); root.add(bal); parts.balloon = bal;
    const str = new T.Mesh(new T.CylinderGeometry(0.018,0.018,1,6),new T.MeshBasicMaterial({color:'#3a2c20'})); root.add(str); parts.string = str; }
  return root;
}

function ensure3d(){
  if(gl3 || gl3Failed || gl3Loading) return !!gl3;
  if(!webglOk()){ gl3Failed = true; return false; }
  gl3Loading = true;
  loadScript('three.min.js').then(()=>{ gl3Loading = false; init3d(); mount3dBear(); if(page==='cal') ensureFlyer(); }).catch(()=>{ gl3Loading = false; gl3Failed = true; });
  return false;
}
function init3d(){
  const T = THREE, W = 170, H = 200;
  const renderer = new T.WebGLRenderer({antialias:true, alpha:true, powerPreference:'low-power'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.setSize(W,H,false); renderer.setClearColor(0x000000,0);
  renderer.domElement.className = 'bear3dcanvas'; renderer.domElement.setAttribute('aria-label','Lern Bär in 3D'); renderer.domElement.setAttribute('role','img');
  const scene = new T.Scene(), cam = new T.PerspectiveCamera(36,W/H,0.1,50); cam.position.set(0,0.3,8.7); cam.lookAt(0,0.0,0);
  scene.add(new T.HemisphereLight(0xffffff,0xd9b88a,0.42)); const dl = new T.DirectionalLight(0xffffff,0.42); dl.position.set(2.5,4,5); scene.add(dl);
  const fill = new T.DirectionalLight(0xffe9c8,0.1); fill.position.set(-3,1,2); scene.add(fill);
  gl3 = {renderer, scene, cam, bear:null, mood:null, t0:performance.now(), spin:0, spinV:0, drag:null, look:{x:0,y:0}, hop:0, raf:0, blinkAt:2, moved:false};
  const cv = renderer.domElement; cv.style.touchAction = 'pan-y';
  cv.addEventListener('pointerdown', e=>{ gl3.drag = {x:e.clientX, id:e.pointerId}; gl3.moved = false; try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
  cv.addEventListener('pointermove', e=>{ if(!gl3.drag) return; const dx = e.clientX-gl3.drag.x; if(Math.abs(dx)>3) gl3.moved = true; gl3.spin += dx*0.012; gl3.drag.x = e.clientX; });
  const end = () => { if(gl3) gl3.drag = null; }; cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end);
  cv.addEventListener('click', e=>{ if(gl3.moved){ e.stopPropagation(); gl3.moved = false; } else gl3.hop = 1; }, true);
  window.addEventListener('pointermove', e=>{ if(!gl3 || !cv.isConnected) return; const r = cv.getBoundingClientRect(); gl3.look.x = Math.max(-1,Math.min(1,(e.clientX-(r.left+r.width/2))/(window.innerWidth/2))); gl3.look.y = Math.max(-1,Math.min(1,(e.clientY-(r.top+r.height/2))/(window.innerHeight/2))); });
}
function dispose3d(obj){ obj.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); }); } }); }
function mount3dBear(){
  const host = document.getElementById('bearmount'); if(!host) return;
  if(!ensure3d() || !gl3) return;
  const m = host.dataset.mood;
  if(gl3.mood !== m){ if(gl3.bear){ gl3.scene.remove(gl3.bear); dispose3d(gl3.bear); } gl3.bear = build3dBear(m); gl3.scene.add(gl3.bear); gl3.mood = m; gl3.hop = 0; }
  host.innerHTML = ''; host.appendChild(gl3.renderer.domElement);
  if(!gl3.raf) gl3.raf = requestAnimationFrame(tick3d);
}
function tick3d(now){
  if(!gl3) return;
  const cv = gl3.renderer.domElement;
  if(!cv.isConnected || document.visibilityState!=='visible'){ gl3.raf = 0; return; }                 // läuft nur, solange der Bär sichtbar ist
  const t = (now - gl3.t0)/1000, b = gl3.bear, P = b.userData.parts, L = b.userData.look, head = P.head, reduce = reducedMotion();
  // Drehen per Wischen, federt zurück
  if(!gl3.drag) gl3.spin *= 0.92; b.rotation.y = gl3.spin;
  // Atmen und Wippen
  const calm = reduce ? 0 : 1; b.position.y = Math.sin(t*1.8)*0.04*calm; P.body.scale.y = 1.12 + Math.sin(t*1.8)*0.012*calm;
  // Kopf folgt dem Finger/Mauszeiger
  const tx = L.droop ? 0.28 : L.tilt ? 0.12 : 0, tz = L.tilt ? 0.28 : 0;
  head.rotation.y += ((gl3.look.x*0.55*(L.tilt?0:1)) - head.rotation.y)*0.12; head.rotation.x += ((tx + gl3.look.y*0.25*(L.droop||L.tilt?0:1)) - head.rotation.x)*0.12; head.rotation.z += (tz - head.rotation.z)*0.1;
  // Blinzeln
  if(P.eyes.length){ const k = (t > gl3.blinkAt && t < gl3.blinkAt+0.14) ? 0.1 : 1; P.eyes.forEach(e=>e.scale.y = 0.11*k); if(t > gl3.blinkAt+0.14) gl3.blinkAt = t + 2.5 + Math.random()*3; }
  // Hüpfer beim Antippen
  if(gl3.hop>0){ gl3.hop = Math.max(0,gl3.hop-0.035); const h = Math.sin((1-gl3.hop)*Math.PI); b.position.y += h*0.5; b.scale.set(1+(0.04*Math.sin((1-gl3.hop)*Math.PI*2)),1-(0.05*Math.sin((1-gl3.hop)*Math.PI*2)),1); } else b.scale.set(1,1,1);
  // Arme
  const wave = Math.sin(t*5), hug = !!L.pot;                       // mit Topf: beide Arme umfassen ihn
  P.armL.rotation.set(hug?-0.9:-0.1, 0, hug?0.55:-0.28); P.armR.rotation.set(hug?-0.9:-0.1, 0, hug?-0.55:0.28);
  if(L.arm==='wave' && !reduce) P.armR.rotation.set(0,0,2.3+wave*0.35); else if(L.arm==='up') P.armR.rotation.set(0,0,2.5+Math.sin(t*3)*0.12); else if(L.arm==='fist') P.armR.rotation.set(0,0,2.0);
  if(L.droop) { P.armL.rotation.set(0,0,-0.1); P.armR.rotation.set(0,0,0.1); }
  if(P.drop){ const k = (t*0.7)%1; P.drop.position.y = 0.42 - k*0.8; P.drop.position.x = 0.05+Math.sin(t*0.7)*0.0; P.drop.visible = k>0.05; }
  // Extras
  P.extras.forEach(sp=>{ const a = t*1.4 + sp.userData.i*2.1; sp.position.set(Math.cos(a)*1.5, 1.2+Math.sin(a*1.3)*0.35+0.7, Math.sin(a)*0.8); sp.rotation.y = t*2; sp.rotation.x = t*1.3; });
  if(P.sweat){ const k = (t*0.6)%1; P.sweat.position.set(0.95,1.25-k*0.55,0.35); P.sweat.traverse(o=>{ if(o.material) o.material.opacity = 0.85*(1-k*k); }); }
  if(P.tear){ const k = (t*0.5)%1; P.tear.position.y = 0.05-k*0.45; P.tear.material.opacity = 0.9*(1-k); }
  if(P.zs){ P.zs.forEach((s,i)=>{ const k = ((t*0.35)+i*0.33)%1; s.position.set(1.0+i*0.2+k*0.3, 1.5+k*1.1, 0.2); s.material.opacity = Math.sin(k*Math.PI); }); }
  if(P.pot) P.pot.rotation.z = Math.sin(t*1.8)*0.03;
  gl3.renderer.render(gl3.scene, gl3.cam);
  gl3.raf = requestAnimationFrame(tick3d);
}
document.addEventListener('visibilitychange', ()=>{ if(gl3 && !gl3.raf && document.visibilityState==='visible') gl3.raf = requestAnimationFrame(tick3d); });

/* Wischen im Kalender: links = nächster Monat, rechts = voriger Monat */
let swipe = null;
app.addEventListener('touchstart',e=>{ swipe = (page==='cal' && e.touches.length===1) ? {x:e.touches[0].clientX,y:e.touches[0].clientY} : null; },{passive:true});
app.addEventListener('touchend',e=>{
  if(!swipe || page!=='cal' || (dg && dg.active)) return;
  const t = e.changedTouches[0], dx = t.clientX-swipe.x, dy = t.clientY-swipe.y; swipe = null;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5) moveMonth(dx<0 ? 1 : -1);
},{passive:true});

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
render();
</script>
